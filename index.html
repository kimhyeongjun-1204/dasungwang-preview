</style></head><body><div style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#E8332C;color:#fff;font:700 12px/1.6 system-ui,sans-serif;text-align:center;padding:2px 8px">미리보기 (머지 전 확인용) · 실제 DB를 써서 신청·비밀번호가 실제로 남아요</div><div id="app"><main><div class="card empty"><div class="pig" aria-hidden="true"></div><b>불러오는 중…</b></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js" integrity="sha384-xPW3QHswsICVC2mW6BFNwMbhpLkbZ133fKOhxNx3QGGgAOJfL3O9t8r2aWn1aez6" crossorigin="anonymous"></script><script src="config.js"></script><script id="app-logic">var Logic = (function () {
  'use strict';

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rng) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function wednesdays(startIso, endIso) {
    var out = [];
    var d = new Date(startIso + 'T00:00:00Z');
    var e = new Date(endIso + 'T00:00:00Z');
    while (d.getUTCDay() !== 3) d.setUTCDate(d.getUTCDate() + 1);
    while (d <= e) { out.push(d.toISOString().slice(0, 10)); d.setUTCDate(d.getUTCDate() + 7); }
    return out;
  }

  // 시즌 수요일 중 진행하지 않은 날(skipDates) 제외
  function seasonDays(settings) {
    var skip = settings.skipDates || [];
    return wednesdays(settings.seasonStart, settings.seasonEnd).filter(function (d) { return skip.indexOf(d) < 0; });
  }

  function isOfficial(m, pid) { return !(m.off && m.off.indexOf(pid) >= 0); }
  function playersOf(m) { return m.a.concat(m.b).filter(Boolean); }

  // pid -> {games(공식), wins, losses, pending, extra(기록 제외 출전), apps}
  function weekTally(week) {
    var t = {};
    (week.matches || []).forEach(function (m) {
      ['a', 'b'].forEach(function (side) {
        m[side].forEach(function (pid) {
          if (!pid) return;
          var r = t[pid] || (t[pid] = { games: 0, wins: 0, losses: 0, pending: 0, extra: 0, apps: 0 });
          r.apps++;
          if (!isOfficial(m, pid)) { r.extra++; return; }
          r.games++;
          if (!m.win) r.pending++;
          else if (m.win === side) r.wins++;
          else r.losses++;
        });
      });
    });
    return t;
  }

  function playerMap(state) {
    var map = {};
    state.players.forEach(function (p) { map[p.id] = p; });
    return map;
  }

  // 조별 순위. countBy: 'registered'(현재 등록 조) | 'pool'(경기한 조)
  // opts.bonus: {pid: 돼블스플랜 보너스} → 원소속 조 행에 bonus·total(공식 승 + 보너스)을 넣고 total로 순위
  // opts.now(ms): 결과 없는 경기 중 그 날 17:30 KST 전은 upcoming(참가 주에도 안 셈), 지난 건 pending(결과 대기). now 없으면 전부 pending
  function standings(state, opts) {
    var useBonus = !!(opts && opts.bonus);
    var now = opts && opts.now != null ? opts.now : null;
    var bonus = useBonus ? opts.bonus : {};
    var pm = playerMap(state);
    var mode = state.settings.countBy || 'registered';
    var rows = {};
    state.settings.groups.forEach(function (g) { rows[g.id] = {}; });
    function row(gid, pid) {
      if (!rows[gid]) rows[gid] = {};
      var p = pm[pid];
      return rows[gid][pid] || (rows[gid][pid] = { id: pid, name: p ? p.name : '(삭제된 선수)', wins: 0, losses: 0, pending: 0, upcoming: 0, weeks: 0 });
    }
    state.players.forEach(function (p) { if (p.active !== false) row(p.group, p.id); });
    state.weeks.forEach(function (w) {
      var seen = {};
      (w.matches || []).forEach(function (m) {
        ['a', 'b'].forEach(function (side) {
          m[side].forEach(function (pid) {
            if (!pid || !isOfficial(m, pid)) return;
            if (!m.win && w.published === false) return; // 공개 전 편성은 집계 제외
            var gid = mode === 'pool' ? m.pool : (pm[pid] ? pm[pid].group : m.pool);
            var r = row(gid, pid);
            if (!m.win && now != null && !matchStarted(w.date, now)) { r.upcoming++; return; } // 앞으로 할 경기
            if (!seen[gid + pid]) { seen[gid + pid] = 1; r.weeks++; }
            if (!m.win) r.pending++;
            else if (m.win === side) r.wins++;
            else r.losses++;
          });
        });
      });
    });
    if (useBonus) Object.keys(bonus).forEach(function (pid) { if (pm[pid] && bonus[pid]) row(pm[pid].group, pid); });
    // 순위 기준 승수: 보너스가 있으면 합계, 없으면 공식 승 (기존과 같음)
    var W = function (r) { return useBonus ? r.total : r.wins; };
    var out = {};
    Object.keys(rows).forEach(function (gid) {
      var g = state.settings.groups.filter(function (x) { return x.id === gid; })[0];
      var winners = g ? g.winners : 1;
      var list = Object.keys(rows[gid]).map(function (k) { return rows[gid][k]; });
      if (useBonus) list.forEach(function (r) { r.bonus = pm[r.id] && pm[r.id].group === gid ? bonus[r.id] || 0 : 0; r.total = r.wins + r.bonus; });
      list.sort(function (x, y) {
        return W(y) - W(x) || x.losses - y.losses || x.name.localeCompare(y.name, 'ko');
      });
      list.forEach(function (r, i) {
        r.rank = i > 0 && W(list[i - 1]) === W(r) ? list[i - 1].rank : i + 1;
      });
      var cutoff = list[winners - 1];
      list.forEach(function (r) {
        r.contender = !!cutoff && W(cutoff) > 0 && W(r) >= W(cutoff);
        r.lottery = false;
      });
      if (cutoff && W(cutoff) > 0) {
        var tied = list.filter(function (r) { return W(r) === W(cutoff); });
        var above = list.filter(function (r) { return W(r) > W(cutoff); }).length;
        if (above + tied.length > winners) tied.forEach(function (r) { r.lottery = true; });
      }
      out[gid] = list;
    });
    return out;
  }

  // 직전 참가 주 성적 → 지옥도(전승)/천국도(전패)/중립/미정
  function tierOf(state, pid, beforeDate) {
    var weeks = state.weeks.filter(function (w) { return w.date < beforeDate; })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    for (var i = 0; i < weeks.length; i++) {
      var t = weekTally(weeks[i])[pid];
      if (!t || t.games === 0) continue;
      var decided = t.wins + t.losses;
      if (decided === 0) return { tier: 'unknown', date: weeks[i].date, wins: 0, losses: 0 };
      var tier = t.wins === decided ? 'hell' : t.wins === 0 ? 'heaven' : 'mid';
      return { tier: tier, date: weeks[i].date, wins: t.wins, losses: t.losses };
    }
    return { tier: 'new' };
  }
  var HEAT = { hell: 2, mid: 1, unknown: 1, new: 1, heaven: 0 };

  // 시즌 누적 승률(편성 균형용, 0~1, 표본 적으면 0.5 쪽으로)
  function skillOf(state, pid, beforeDate) {
    var w = 0, l = 0;
    state.weeks.forEach(function (wk) {
      if (wk.date >= beforeDate) return;
      var t = weekTally(wk)[pid];
      if (t) { w += t.wins; l += t.losses; }
    });
    return (w + 1) / (w + l + 2);
  }

  var PAIRINGS = [[0, 1, 2, 3], [0, 2, 1, 3], [0, 3, 1, 2]];
  function pkey(x, y) { return x < y ? x + '|' + y : y + '|' + x; }

  // 편성 조건(돼장 요청): 2인 조건과 1인 조건
  var RULE_ARITY = { no_partner: 2, want_partner: 2, no_same_game: 2, extra_prefer: 1, extra_avoid: 1 };
  var RULE_COST = 2000;
  function compileRules(rules, byId) {
    var R = { noPartner: {}, noGame: {}, want: [], prefer: {}, avoid: {} };
    (rules || []).forEach(function (r) {
      var ps = r && r.players || [];
      if (RULE_ARITY[r.type] !== ps.length || ps.some(function (p) { return !byId[p]; })) return;
      if (r.type === 'no_partner') R.noPartner[pkey(ps[0], ps[1])] = 1;
      else if (r.type === 'no_same_game') R.noGame[pkey(ps[0], ps[1])] = 1;
      else if (r.type === 'want_partner') R.want.push(pkey(ps[0], ps[1]));
      else if (r.type === 'extra_prefer') R.prefer[ps[0]] = 1;
      else if (r.type === 'extra_avoid') R.avoid[ps[0]] = 1;
    });
    return R;
  }

  function evaluate(games, byId, R) {
    R = R || compileRules([], byId);
    var partner = {}, opp = {}, cost = 0, pairs = [];
    for (var g = 0; g < games.length; g++) {
      var gm = games[g];
      if (gm[0] === gm[1] || gm[0] === gm[2] || gm[0] === gm[3] || gm[1] === gm[2] || gm[1] === gm[3] || gm[2] === gm[3]) {
        cost += 1e6; pairs.push(null); continue;
      }
      var hs = gm.map(function (id) { return byId[id].heat; });
      cost += (Math.max.apply(null, hs) - Math.min.apply(null, hs)) * 30;
      for (var u = 0; u < 4; u++) for (var v = u + 1; v < 4; v++) if (R.noGame[pkey(gm[u], gm[v])]) cost += RULE_COST;
      var best = null, bc = Infinity;
      for (var p = 0; p < 3; p++) {
        var P = PAIRINGS[p];
        var A = [gm[P[0]], gm[P[1]]], B = [gm[P[2]], gm[P[3]]];
        var c = 0;
        if (partner[pkey(A[0], A[1])]) c += 1000;
        if (partner[pkey(B[0], B[1])]) c += 1000;
        if (R.noPartner[pkey(A[0], A[1])] || R.noPartner[pkey(B[0], B[1])]) c += RULE_COST;
        // 같은 팀 희망인 두 사람이 이 경기에 같이 있는데 아직 파트너가 아니면 갈라놓는 쪽에 벌점
        for (var w = 0; w < R.want.length; w++) {
          var wk = R.want[w];
          if (partner[wk]) continue;
          var inA = pkey(A[0], A[1]) === wk, inB = pkey(B[0], B[1]) === wk;
          var both = wk.split('|').every(function (id) { return gm.indexOf(id) >= 0; });
          if (both && !inA && !inB) c += RULE_COST * 0.75;
        }
        var sa = byId[A[0]].skill + byId[A[1]].skill, sb = byId[B[0]].skill + byId[B[1]].skill;
        c += Math.abs(sa - sb) * 40;
        for (var i = 0; i < 2; i++) for (var j = 0; j < 2; j++) if (opp[pkey(A[i], B[j])]) c += 8;
        if (c < bc) { bc = c; best = [A, B]; }
      }
      cost += bc;
      partner[pkey(best[0][0], best[0][1])] = 1;
      partner[pkey(best[1][0], best[1][1])] = 1;
      for (var x = 0; x < 2; x++) for (var y = 0; y < 2; y++) opp[pkey(best[0][x], best[1][y])] = 1;
      pairs.push(best);
    }
    R.want.forEach(function (wk) { if (!partner[wk]) cost += RULE_COST; });
    return { cost: cost, pairs: pairs };
  }

  // 연속 출전이 적도록 경기 순서 정하기
  function orderGames(pairs) {
    var left = pairs.slice(), out = [];
    var prev = [];
    while (left.length) {
      var bi = 0, bs = Infinity;
      for (var i = 0; i < left.length; i++) {
        var ps = left[i][0].concat(left[i][1]);
        var s = ps.filter(function (p) { return prev.indexOf(p) >= 0; }).length;
        if (s < bs) { bs = s; bi = i; }
      }
      var g = left.splice(bi, 1)[0];
      out.push(g);
      prev = g[0].concat(g[1]);
    }
    return out;
  }

  // players: [{id, heat(0~2), skill(0~1)}], opts.rules: 편성 조건 → {matches:[{a,b,off}]} 또는 {error}
  function generatePool(players, seed, opts) {
    opts = opts || {};
    var n = players.length;
    if (n < 4) return { error: '4명 이상이어야 편성할 수 있어요 (현재 ' + n + '명)' };
    var rng = mulberry32(seed >>> 0);
    var G = Math.ceil(n / 2);
    var extraCount = 4 * G - 2 * n;
    var byId = {};
    players.forEach(function (p) { byId[p.id] = p; });
    var R = compileRules(opts.rules, byId);
    var restarts = opts.restarts || 12, iters = opts.iters || (300 + G * 100);
    var best = null;
    for (var r = 0; r < restarts; r++) {
      var slots = [];
      players.forEach(function (p) { slots.push(p.id, p.id); });
      var ids = shuffle(players.map(function (p) { return p.id; }), rng);
      // 추가출전(3번 출전)은 시작할 때 정해지고 자리 바꾸기로는 안 바뀜: 우선 지정 → 보통 → 제외 순으로 고름
      ids = ids.filter(function (id) { return R.prefer[id]; })
        .concat(ids.filter(function (id) { return !R.prefer[id] && !R.avoid[id]; }), ids.filter(function (id) { return R.avoid[id] && !R.prefer[id]; }));
      for (var k = 0; k < extraCount; k++) slots.push(ids[k]);
      shuffle(slots, rng);
      var games = [];
      for (var g = 0; g < G; g++) games.push(slots.slice(g * 4, g * 4 + 4));
      var cur = evaluate(games, byId, R).cost;
      for (var it = 0; it < iters && cur > 0; it++) {
        var g1 = Math.floor(rng() * G), g2 = Math.floor(rng() * G);
        if (g1 === g2) continue;
        var i1 = Math.floor(rng() * 4), i2 = Math.floor(rng() * 4);
        var t = games[g1][i1]; games[g1][i1] = games[g2][i2]; games[g2][i2] = t;
        var c = evaluate(games, byId, R).cost;
        if (c <= cur) cur = c;
        else { t = games[g1][i1]; games[g1][i1] = games[g2][i2]; games[g2][i2] = t; }
      }
      if (!best || cur < best.cost) best = { cost: cur, games: games.map(function (x) { return x.slice(); }) };
    }
    var ev = evaluate(best.games, byId, R);
    if (ev.pairs.indexOf(null) >= 0) return { error: '편성에 실패했어요. 다시 시도해 주세요' };
    var ordered = orderGames(ev.pairs);
    var count = {};
    var matches = ordered.map(function (pr) {
      var m = { a: pr[0].slice(), b: pr[1].slice(), off: [] };
      m.a.concat(m.b).forEach(function (pid) {
        count[pid] = (count[pid] || 0) + 1;
        if (count[pid] > 2) m.off.push(pid);
      });
      return m;
    });
    return { matches: matches, cost: best.cost };
  }

  function validateWeek(state, week) {
    var pm = playerMap(state);
    var name = function (id) { return pm[id] ? pm[id].name : id; };
    var issues = [];
    var partners = {};
    (week.matches || []).forEach(function (m, i) {
      var label = (i + 1) + '경기';
      var ps = m.a.concat(m.b);
      if (ps.filter(Boolean).length < 4) issues.push({ level: 'error', code: 'incomplete', match: m.id, msg: label + ': 선수 4명이 다 채워지지 않았어요' });
      var f = ps.filter(Boolean);
      if (new Set(f).size < f.length) issues.push({ level: 'error', code: 'dup_in_match', match: m.id, msg: label + ': 같은 선수가 두 번 들어가 있어요' });
      [m.a, m.b].forEach(function (t) {
        if (!t[0] || !t[1] || t[0] === t[1]) return;
        var k = pkey(t[0], t[1]);
        if (partners[k]) issues.push({ level: 'warn', code: 'partner_repeat', match: m.id, msg: name(t[0]) + '·' + name(t[1]) + ' 파트너가 ' + partners[k] + '와 ' + label + '에서 겹쳐요' });
        else partners[k] = label;
      });
    });
    var tally = weekTally(week);
    var att = week.attendees || {};
    Object.keys(att).forEach(function (pid) {
      var g = tally[pid] ? tally[pid].games : 0;
      if (g !== 2) issues.push({ level: 'warn', code: 'official_count', pid: pid, msg: name(pid) + ': 공식 ' + g + '경기 (2경기여야 해요)' });
    });
    Object.keys(tally).forEach(function (pid) {
      if (!att[pid]) issues.push({ level: 'warn', code: 'not_attending', pid: pid, msg: name(pid) + ': 참석 체크가 안 된 채 경기에 들어가 있어요' });
    });
    (week.rules || []).forEach(function (r) {
      var why = ruleViolation(week, r);
      if (why) issues.push({ level: 'warn', code: 'rule', rule: r.id, msg: ruleText(state, r) + ': ' + why });
    });
    return issues;
  }

  var RULE_LABEL = { no_partner: '같은 팀 금지', want_partner: '같은 팀 희망', no_same_game: '같은 경기 금지', extra_prefer: '추가출전 우선', extra_avoid: '추가출전 제외' };
  function ruleText(state, r) {
    var pm = playerMap(state);
    return (r.players || []).map(function (id) { return pm[id] ? pm[id].name : id; }).join('·') + ' ' + (RULE_LABEL[r.type] || r.type);
  }
  // 이 주 편성이 조건을 어기면 이유, 지키면 null (matches: 볼 경기, 기본은 그 주 전체)
  function ruleViolation(week, r, matches) {
    var ms = matches || week.matches || [], ps = r.players || [], p = ps[0], q = ps[1];
    var label = function (m) { return ((week.matches || []).indexOf(m) + 1) + '경기'; };
    var hit;
    if (r.type === 'no_partner') {
      hit = ms.filter(function (m) { return [m.a, m.b].some(function (t) { return t.indexOf(p) >= 0 && t.indexOf(q) >= 0; }); })[0];
      return hit ? label(hit) + '에서 한 팀이에요' : null;
    }
    if (r.type === 'no_same_game') {
      hit = ms.filter(function (m) { var all = m.a.concat(m.b); return all.indexOf(p) >= 0 && all.indexOf(q) >= 0; })[0];
      return hit ? label(hit) + '에 같이 들어가 있어요' : null;
    }
    var inAny = function (id) { return ms.some(function (m) { return m.a.concat(m.b).indexOf(id) >= 0; }); };
    if (r.type === 'want_partner') {
      if (!inAny(p) || !inAny(q)) return null;
      return ms.some(function (m) { return [m.a, m.b].some(function (t) { return t.indexOf(p) >= 0 && t.indexOf(q) >= 0; }); }) ? null : '한 번도 같은 팀이 아니에요';
    }
    var isOff = function (id) { return ms.some(function (m) { return (m.off || []).indexOf(id) >= 0; }); };
    if (r.type === 'extra_avoid') return isOff(p) ? '추가출전으로 들어가 있어요' : null;
    if (r.type === 'extra_prefer') {
      var pool = (week.attendees || {})[p];
      if (!inAny(p) || isOff(p)) return null;
      var others = ms.some(function (m) { return m.pool === pool && (m.off || []).some(function (id) { return id !== p; }); });
      return others ? '다른 사람이 추가출전이에요' : null;
    }
    return null;
  }

  // 지옥도는 한 조 위, 천국도는 한 조 아래에서 경기 (조 순서: settings.groups 앞이 강한 조)
  // → [{player, from, to, tier}]. 편성 조가 등록 조와 같은 참석자만 (돼장이 직접 옮긴 사람은 그대로)
  function tierShift(state, date) {
    var week = state.weeks.filter(function (w) { return w.date === date; })[0];
    return tierCandidates(state, date).filter(function (c) { return week.attendees[c.player] === c.from; })
      .map(function (c) { return { player: c.player, from: c.from, to: c.to, tier: c.tier }; });
  }
  // 등록 조 기준으로 옮길 조: up(한 조 위) / down(한 조 아래) / back(원래 조). 없으면 null
  function shiftTarget(state, pid, dir) {
    var p = playerMap(state)[pid];
    if (!p) return null;
    var order = state.settings.groups.map(function (g) { return g.id; }), i = order.indexOf(p.group);
    if (i < 0) return null;
    return (dir === 'up' ? order[i - 1] : dir === 'down' ? order[i + 1] : dir === 'back' ? p.group : null) || null;
  }
  // 이번 주 참석자 중 옮길 수 있는 지옥도·천국도 후보 전부 → [{player, from(등록 조), to, tier, moved(지금 to에서 뜀)}]
  function tierCandidates(state, date) {
    var week = state.weeks.filter(function (w) { return w.date === date; })[0];
    if (!week) return [];
    var pm = playerMap(state), order = state.settings.groups.map(function (g) { return g.id; }), out = [];
    Object.keys(week.attendees || {}).forEach(function (id) {
      var p = pm[id];
      if (!p) return;
      var t = tierOf(state, id, date).tier, i = order.indexOf(p.group);
      var to = t === 'hell' ? order[i - 1] : t === 'heaven' ? order[i + 1] : null;
      if (i >= 0 && to) out.push({ player: id, from: p.group, to: to, tier: t, moved: week.attendees[id] === to });
    });
    return out;
  }

  // 공식 경기가 들어가 있는 조들 (pid → {조: 1})
  function officialPools(week) {
    var r = {};
    (week.matches || []).forEach(function (m) {
      m.a.concat(m.b).forEach(function (id) { if (id && isOfficial(m, id)) (r[id] = r[id] || {})[m.pool] = 1; });
    });
    return r;
  }

  // 한 조를 (저장된 조건까지 지켜서) 다시 짜서 week.matches에 반영. week는 직접 바뀜
  // 편성 조를 따로 옮긴 적 없는(편성 조 = 등록 조) 사람이 공식 경기를 전부 다른 조에서 하면 실제로 뛰는 조 사람으로 봄
  // (돼장이 경기 칸에 직접 넣은 경우). fixed: 이번에 조를 옮긴 사람 {id:1} — 편성 조를 그대로 믿음
  // → {count, split:[두 조에 나눠 들어가 있어 경기 수가 어긋날 사람]} 또는 {error}
  function regenPool(state, week, gid, seed, newId, fixed) {
    var pm = playerMap(state), op = officialPools(week);
    var poolOf = function (id) {
      var ps = Object.keys(op[id] || {});
      if ((fixed && fixed[id]) || week.attendees[id] !== pm[id].group || ps.length !== 1) return week.attendees[id];
      return ps[0];
    };
    var split = Object.keys(op).filter(function (id) { return op[id][gid] && Object.keys(op[id]).length > 1; });
    var ids = Object.keys(week.attendees || {}).filter(function (id) { return pm[id] && poolOf(id) === gid && split.indexOf(id) < 0; })
      .concat(Object.keys(week.attendees || {}).filter(function (id) { return pm[id] && split.indexOf(id) >= 0 && week.attendees[id] === gid; }));
    ids.forEach(function (id) { week.attendees[id] = gid; });
    var order = state.settings.groups.map(function (g) { return g.id; });
    var keep = (week.matches || []).filter(function (m) { return m.pool !== gid; });
    var fresh = [];
    if (ids.length) {
      var ps = ids.map(function (id) { return { id: id, heat: HEAT[tierOf(state, id, week.date).tier], skill: strengthOf(state, id, week.date, gid) }; });
      var rules = (week.rules || []).filter(function (r) { return (r.players || []).every(function (id) { return ids.indexOf(id) >= 0; }); });
      var res = generatePool(ps, seed, { rules: rules });
      if (res.error) return { error: res.error };
      fresh = res.matches.map(function (m) { return { id: newId(), pool: gid, a: m.a, b: m.b, off: m.off, win: null, score: '' }; });
    }
    var all = keep.concat(fresh).map(function (m, i) { return { m: m, i: i }; });
    all.sort(function (x, y) {
      var ox = order.indexOf(x.m.pool), oy = order.indexOf(y.m.pool);
      return (ox < 0 ? 99 : ox) - (oy < 0 ? 99 : oy) || x.i - y.i;
    });
    week.matches = all.map(function (x) { return x.m; });
    return { count: fresh.length, split: split };
  }

  // 돼장 요청을 해석한 계획을 적용: 조건 삭제·추가 → 조 옮기기 → 다시 짜기 → 직접 수정
  // plan: {rules_add:[{type,players}], rules_remove:[id], pool_moves:[{player,pool}], regenerate:[gid],
  //        edits:[{type:'swap',players:[p,q],matches?:[id]} | {type:'set_slot',match,side,index,player} | {type:'set_off',match,player,off}]}
  // → {week(새 객체), regenerated:[gid], errors:[문장], warnings:[문장]}  (state는 바꾸지 않음)
  function applyPlan(state, date, plan, opt) {
    opt = opt || {};
    plan = plan || {};
    var st = JSON.parse(JSON.stringify(state));
    var week = st.weeks.filter(function (w) { return w.date === date; })[0];
    if (!week) { week = { date: date, published: false, attendees: {}, matches: [] }; st.weeks.push(week); }
    week.attendees = week.attendees || {};
    week.matches = week.matches || [];
    week.rules = week.rules || [];
    var pm = playerMap(st), errors = [], warnings = [], touched = {}, moved = {};
    var gids = st.settings.groups.map(function (g) { return g.id; });
    var newId = opt.newId || function () { return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); };
    var seed = opt.seed == null ? (Math.random() * 4294967296) >>> 0 : opt.seed;
    var nm = function (id) { return pm[id] ? pm[id].name : String(id); };
    var findM = function (id) { return week.matches.filter(function (m) { return m.id === id; })[0]; };

    (plan.rules_remove || []).forEach(function (id) {
      if (!week.rules.some(function (r) { return r.id === id; })) { errors.push('없는 조건이라 지우지 못했어요: ' + id); return; }
      week.rules = week.rules.filter(function (r) { return r.id !== id; });
    });
    (plan.rules_add || []).forEach(function (r) {
      var type = r && r.type, ps = (r && r.players) || [];
      if (!RULE_ARITY[type]) { errors.push('알 수 없는 조건 종류예요: ' + type); return; }
      var bad = ps.filter(function (p) { return !pm[p]; });
      if (ps.length !== RULE_ARITY[type] || bad.length || (ps.length === 2 && ps[0] === ps[1])) {
        errors.push('조건에 맞지 않는 선수예요: ' + (bad.length ? bad.join(', ') : ps.map(nm).join('·'))); return;
      }
      var rule = { id: 'r' + newId(), type: type, players: ps.slice() };
      week.rules.push(rule);
      // 지금 편성이 새 조건을 어기는 조만 다시 짬
      gids.forEach(function (g) {
        if (ruleViolation(week, rule, week.matches.filter(function (m) { return m.pool === g; }))) touched[g] = 1;
      });
    });
    (plan.pool_moves || []).forEach(function (mv) {
      var p = mv && mv.player, g = mv && mv.pool;
      if (!pm[p] || gids.indexOf(g) < 0) { errors.push('조 옮기기를 할 수 없어요: ' + nm(p) + ' → ' + g); return; }
      if (!week.attendees[p]) { errors.push(nm(p) + '은(는) 이번 주 참석자가 아니에요'); return; }
      touched[week.attendees[p]] = 1; touched[g] = 1;
      week.attendees[p] = g; moved[p] = 1;
    });
    (plan.regenerate || []).forEach(function (g) {
      if (gids.indexOf(g) < 0) errors.push('없는 조예요: ' + g); else touched[g] = 1;
    });
    var regenerated = [];
    gids.forEach(function (g, i) {
      if (!touched[g]) return;
      var res = regenPool(st, week, g, (seed + i * 7919) >>> 0, newId, moved);
      if (res.error) { errors.push(g + '조 다시 짜기 실패: ' + res.error); return; }
      regenerated.push(g);
      res.split.forEach(function (id) { warnings.push(nm(id) + ': 두 조 경기에 나눠 들어가 있어서 ' + g + '조를 다시 짜면 경기 수가 맞지 않아요. 한 조로 옮겨 주세요.'); });
    });

    (plan.edits || []).forEach(function (e) {
      var type = e && e.type;
      if (type === 'swap') {
        var ps = e.players || [], p = ps[0], q = ps[1];
        if (ps.length !== 2 || !pm[p] || !pm[q] || p === q) { errors.push('맞바꿀 두 선수를 찾지 못했어요'); return; }
        var targets = e.matches && e.matches.length ? e.matches.map(findM) : week.matches;
        if (targets.some(function (m) { return !m; })) { errors.push('없는 경기라 맞바꾸지 못했어요: ' + e.matches.join(', ')); return; }
        var sw = function (id) { return id === p ? q : id === q ? p : id; };
        targets.forEach(function (m) { m.a = m.a.map(sw); m.b = m.b.map(sw); m.off = (m.off || []).map(sw); });
      } else if (type === 'set_slot') {
        var m = findM(e.match);
        if (!m || (e.side !== 'a' && e.side !== 'b') || (e.index !== 0 && e.index !== 1) || (e.player && !pm[e.player])) { errors.push('경기 자리를 바꾸지 못했어요: ' + e.match); return; }
        m[e.side][e.index] = e.player || '';
        m.off = (m.off || []).filter(function (id) { return m.a.concat(m.b).indexOf(id) >= 0; });
      } else if (type === 'set_off') {
        var m2 = findM(e.match);
        if (!m2 || m2.a.concat(m2.b).indexOf(e.player) < 0) { errors.push('추가출전 표시를 바꾸지 못했어요: ' + nm(e.player)); return; }
        m2.off = (m2.off || []).filter(function (id) { return id !== e.player; });
        if (e.off) m2.off.push(e.player);
      } else errors.push('알 수 없는 수정 종류예요: ' + type);
    });
    return { week: week, regenerated: regenerated, errors: errors, warnings: warnings };
  }

  var HINTS = { '캐비어': 'A', '랍스터': 'A', '소갈비': 'B', '양갈비': 'B', '돼지갈비': 'C', '닭갈비': 'C', '돼지': 'C', '닭': 'C' };
  function parseBand(text, players) {
    var byName = {};
    players.forEach(function (p) { if (p.active !== false) byName[p.name] = p.id; });
    var matched = [], unknown = [], seen = {};
    String(text || '').split(/[,\n\r，、]+/).forEach(function (tok) {
      var m = tok.trim().replace(/^\d+[.)]\s*/, '').match(/^([가-힣A-Za-z]{2,6})\s*(?:\(([^)]*)\))?/);
      if (!m) return;
      var nm = m[1], hint = (m[2] || '').trim();
      if (seen[nm]) return;
      if (byName[nm]) { seen[nm] = 1; matched.push(byName[nm]); return; }
      if (hint) {
        var g = HINTS[hint] || null;
        if (!g) Object.keys(HINTS).forEach(function (h) { if (!g && hint.indexOf(h) >= 0) g = HINTS[h]; });
        seen[nm] = 1;
        unknown.push({ name: nm, group: g });
      }
    });
    return { matched: matched, unknown: unknown };
  }

  // ---- 실력 시드: {A:[pid 1위, 2위…], B:[…], C:[…]} — 화면에 안 보이게 가볍게 인코딩
  function b64e(s) { return typeof btoa === 'function' ? btoa(s) : Buffer.from(s, 'binary').toString('base64'); }
  function b64d(s) { return typeof atob === 'function' ? atob(s) : Buffer.from(s, 'base64').toString('binary'); }
  function encodeSeeds(seeds) {
    var s = unescape(encodeURIComponent(JSON.stringify(seeds || {})));
    return 's1:' + b64e(s).split('').reverse().join('');
  }
  function decodeSeeds(enc) {
    if (typeof enc !== 'string' || enc.indexOf('s1:') !== 0) return {};
    try {
      var o = JSON.parse(decodeURIComponent(escape(b64d(enc.slice(3).split('').reverse().join('')))));
      return o && typeof o === 'object' ? o : {};
    } catch (e) { return {}; }
  }
  function parseOrder(text, players) {
    var byName = {};
    players.forEach(function (p) { byName[p.name] = p.id; });
    var ids = [], unknown = [], seen = {};
    String(text || '').split(/[,\n\r，、]+/).forEach(function (tok) {
      var nm = tok.trim().replace(/^\d+\s*[.)위]?\s*/, '').replace(/\(.*$/, '').trim();
      if (!/^[가-힣A-Za-z]{2,6}$/.test(nm) || seen[nm]) return;
      seen[nm] = 1;
      if (byName[nm]) ids.push(byName[nm]); else unknown.push(nm);
    });
    return { ids: ids, unknown: unknown };
  }
  // 편성용 실력(0~1): 시드 점수 → 경기가 쌓일수록 실제 승률 비중↑ (6경기면 반반)
  function strengthOf(state, pid, beforeDate, pool) {
    var pm = playerMap(state), p = pm[pid];
    var order = state.settings.groups.map(function (g) { return g.id; });
    var seedScore = 0.5;
    if (p && pool && p.group !== pool && order.indexOf(p.group) >= 0 && order.indexOf(pool) >= 0) {
      seedScore = order.indexOf(p.group) < order.indexOf(pool) ? 1 : 0;
    } else if (p) {
      var list = (decodeSeeds(state.settings.seeds)[p.group] || []).filter(function (id) { return pm[id] && pm[id].group === p.group; });
      var r = list.indexOf(pid);
      if (r >= 0) seedScore = list.length > 1 ? 1 - r / (list.length - 1) : 0.5;
    }
    var w = 0, l = 0;
    state.weeks.forEach(function (wk) {
      if (wk.date >= beforeDate) return;
      var t = weekTally(wk)[pid];
      if (t) { w += t.wins; l += t.losses; }
    });
    var dec = w + l;
    if (!dec) return seedScore;
    var wr = dec / (dec + 6);
    return seedScore * (1 - wr) + ((w + 1) / (dec + 2)) * wr;
  }
  function balanceOf(sumA, sumB) {
    var d = Math.abs(sumA - sumB);
    return d <= 0.15 ? 'even' : d <= 0.4 ? 'ok' : 'lopsided';
  }

  // ---------- 돼블스플랜(승부 예측) ----------
  // 규칙 숫자는 여기서만 바꿈. 마감 시각은 앱에서 바꿀 수 없음(테스트는 now 인자로 시험)
  var PREDICT = {
    picks: 4,
    closeUtc: { h: 8, m: 30 },                 // 수요일 17:30 KST = 08:30 UTC
    bonus: { high: { hit: 3, miss: -2 }, safe: { hit: 1, miss: 0 } },   // 하이리스크 실패 -2 (돼장 결정 2026-11-16)
    quota: { A: 1, B: 2, C: 1 },                // 조별로 고를 경기 수: 캐비어·랍스터 1 · 소갈비·양갈비 2 · 돼지갈비·닭갈비 1 (schema.sql pred_check와 같게)
    upperShare: 0.7,                            // 🔺상한가: 한 경기 안에서 이 비율 이상
    changeWindowMs: 3600e3,                     // 인기 픽 ▲▼: 최근 1시간 증감
    hotShare: 0.7, underShare: 0.3,             // 인기 픽 배지: 70% 초과 / 역배 후보: 30% 미만
    badgeMin: 5,                                // 그 경기를 고른 사람이 이보다 적으면 배지 없음
  };
  function predictionDeadline(weekDate) {
    var p = String(weekDate).split('-');
    return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], PREDICT.closeUtc.h, PREDICT.closeUtc.m));
  }
  function isPredictionClosed(weekDate, now) { return now >= predictionDeadline(weekDate).getTime(); }
  // 경기 시작(= 예측 마감과 같은 수요일 17:30 KST) 지났는지. 결과 대기 표시 기준
  function matchStarted(weekDate, now) { return isPredictionClosed(weekDate, now); }
  function matchOf(week, id) { return week && (week.matches || []).filter(function (m) { return m.id === id; })[0] || null; }
  function matchValid(m) { return !!m && m.a.length === 2 && m.b.length === 2 && m.a.concat(m.b).every(Boolean); }

  // 오류 코드 목록: count(4개 아님) / dup_match / no_match / bad_side
  function validatePicks(picks, week) {
    if (!Array.isArray(picks) || picks.length !== PREDICT.picks) return ['count'];
    var out = [], seen = {};
    picks.forEach(function (p) {
      var id = p && p.match;
      if (seen[id] && out.indexOf('dup_match') < 0) out.push('dup_match');
      seen[id] = 1;
      if (!matchOf(week, id) && out.indexOf('no_match') < 0) out.push('no_match');
      if (!p || (p.side !== 'a' && p.side !== 'b')) { if (out.indexOf('bad_side') < 0) out.push('bad_side'); }
    });
    var st = !out.length && quotaStatus(picks, week);
    if (st && Object.keys(st).some(function (g) { return st[g].have !== st[g].need; })) out.push('quota');
    return out;
  }

    var out = '<div class="gsel" role="group" aria-label="조 선택">' + groups().map(function (x) {
      return '<button class="g' + x.id + '" data-act="rankg" data-v="' + x.id + '" aria-pressed="' + (x.id === g.id) + '">' + esc(x.name) + '</button>';
    }).join('') + '</div>';
    out += '<div class="team-zone g' + g.id + '">' + teamBanner(g, ['다승왕 ' + g.winners + '명', '남은 수요일 ' + remain + '번']) + '<p class="muted small num">1인 최대 +' + remain * 2 + '승까지 남았어요.</p>';
    if (!played.length) {
      out += '<div class="card empty"><div class="pig" aria-hidden="true"></div><b>아직 입력된 결과가 없어요</b><p class="muted">돼장이 경기 결과를 입력하면 승수와 순위가 바로 계산돼요.</p></div>';
    } else {

        var tag = r.lottery ? crown('동률 추첨') : r.contender ? crown('다승왕권') : '';

        return '<div class="rrow' + (r.contender ? ' contender' : '') + (r.id === ui.me ? ' me' : '') + '"><span class="medal num' + (r.rank <= 3 && tot > 0 ? ' m' + r.rank : '') + '">' + (dec || r.bonus ? r.rank : '–') + '</span>' +
          '<span class="rname"><b>' + esc(r.name) + '</b>' + tag + '<span class="sub num">' + r.weeks + '주 참가' + (r.pending ? ' · <span class="nw">결과 대기 ' + r.pending + '경기</span>' : '') + '</span></span>' +
          '<span class="rnum strong num total" aria-label="총합 ' + tot + '승">' + tot + '</span><span class="rnum num">' + r.wins + '</span><span class="rnum num bonus' + (r.bonus > 0 ? ' plus' : r.bonus < 0 ? ' minus' : '') + '" aria-label="보너스 ' + r.bonus + '">' + (r.bonus ? signed(r.bonus) : '–') + '</span><span class="rnum num">' + r.losses + '</span></div>';
      }).join('') + '</div><p class="small muted">총합 = 승(공식 경기) + 돼블스플랜 보너스 · 순위는 총합 기준</p>';
    }
    out += '</div>';
    if (idle.length) out += '<details><summary>아직 기록 없는 ' + idle.length + '명</summary><p class="small muted">' + idle.map(function (r) { return esc(r.name); }).join(', ') + '</p></details>';
    out += '<p class="small muted">총합(공식 승 + 예측 보너스)으로 순위를 매기고, 최종 동률이면 추첨해요. 공식 2경기만 집계하고 추가출전·자유게임은 빠져요. 다른 조 경기에 나가도 승수는 원소속 조로 들어가요.</p>';
    return out;
  }

  var FATE_TEXT = {
    hell: '치열한 승부, 살벌한 랠리. 지난번 전승의 대가로 강한 상대와 붙어요.',
    heaven: '달콤한 휴식, 잠시 행복회로! 지난번 전패의 선물이에요.',
    mid: '1승 1패, 균형 잡힌 중간 난도로 편성돼요.',
    new: '아직 기록이 없어서 중간 난도로 편성돼요.',
    unknown: '지난 경기 결과가 입력되면 배정이 정해져요.',
  };
  // 공지문 '돼장의 마지막 한마디' 그대로
  var FATE_QUOTE = { hell: '그렇다면 지옥으로 모시겠습니다.', heaven: '천국행 티켓을 발급해 드리겠습니다.' };
  function viewMe() {
    var P = pm(), me = P[ui.me];
    var pick = '';
    if (!me) return '<div class="card empty"><div class="pig" aria-hidden="true"></div><b>회원 명단에서 내 이름을 찾지 못했어요</b><p class="muted">돼장에게 회원 관리에서 확인해 달라고 해 주세요.</p></div>';
    var S = L.standings(work, { bonus: bonusMap(), now: Date.now() });
    var gid = work.settings.countBy === 'pool' ? null : me.group;
    var row = null, gsize = 0, gw = 1;
    Object.keys(S).forEach(function (k) {
      if (gid && k !== gid) return;
      var r = S[k].filter(function (x) { return x.id === me.id; })[0];
      if (r && (!row || r.wins > row.wins)) { row = r; gsize = S[k].filter(function (x) { return x.wins + x.losses + x.pending > 0 || x.bonus; }).length; var g = groups().filter(function (x) { return x.id === k; })[0]; gw = g ? g.winners : 1; }
    });
    var nd = nextPlayDate(), tier = L.tierOf(work, me.id, nd);
    var ndLabel = md(nd === '9999-12-31' ? work.settings.seasonEnd : nd);
    var myG = groups().filter(function (x) { return x.id === me.group; })[0];
    var wrap = function (body) { return pick + '<div class="team-zone me-zone g' + me.group + '">' + body + '</div>' + mePinCard(); };
    var rec = L.meRecord(row);   // 총합 = 공식 승 + 돼블스플랜 보너스
    var prec = pred.allOk ? L.predictionRecord(work, pred.all, me.id) : null;
    var out = myG ? teamBanner(myG, ['내 조', rec.has ? '조 내 ' + row.rank + '위' : '기록 대기']) : '';
    out += '<div class="card"><div class="me-head"><h2>' + esc(me.name) + '</h2><span class="gdot g' + me.group + '">' + esc(gname(me.group)) + '조</span></div>' +
      '<div class="stat-row"><div class="stat' + (row && row.contender ? ' hl' : '') + '"><b class="num">' + (rec.has ? row.rank + '위' : '–') + '</b><span>조 내 순위' + (gsize ? ' / ' + gsize + '명' : '') + '</span></div>' +
      '<div class="stat total"><b class="num">' + rec.total + '승</b><span>총합 · 순위 기준</span></div></div>' +
      // 총합 내역: 공식 승 + 예측 승 | 패 (예측 승 = 돼블스플랜 보너스, 적중·실패 횟수 함께)
      '<div class="rec-split" role="group" aria-label="총합 내역">' +
        '<div><span>공식 승</span><b class="num">' + rec.wins + '</b></div><i aria-hidden="true">+</i>' +
        '<div class="pwin' + (rec.bonus > 0 ? ' plus' : rec.bonus < 0 ? ' minus' : '') + '"><span>예측 승</span><b class="num">' + signed(rec.bonus) + '</b>' +
          (prec && prec.hit + prec.miss + prec.pending ? '<small class="num">적중 ' + prec.hit + ' · 실패 ' + prec.miss + (prec.pending ? ' · 진행 ' + prec.pending : '') + '</small>' : '') + '</div>' +
        '<div class="loss"><span>패</span><b class="num">' + rec.losses + '</b></div>' +
      '</div>' +
      (row && row.pending ? '<p class="small muted num">결과 대기 ' + row.pending + '경기</p>' : '') +
      (row && row.lottery ? '<p class="small">' + crown('동률 추첨') + ' 지금 끝나면 다승왕 ' + gw + '자리를 두고 추첨 대상이에요.</p>' : row && row.contender ? '<p class="small">' + crown('다승왕권') + ' 지금 순위면 다승왕이에요!</p>' : '') +
      '</div>';
    out += pushCard(false);
    var fk = tier.tier === 'hell' || tier.tier === 'heaven' ? tier.tier : 'mid';
    var fch = (TEAM_CHARS[me.group] || [])[1];
    out += '<section class="fate fate-' + fk + '" aria-label="다음 경기 배정">' +
      '<div class="fate-top"><span class="fate-eyebrow num">' + ndLabel + '(수) 내 배정</span>' +
      '<span class="fate-basis num">' + (tier.date ? md(tier.date) + ' · ' + tier.wins + '승 ' + tier.losses + '패' : '지난 기록 없음') + '</span></div>' +
      '<strong class="fate-name">' + TIER_LABEL[tier.tier] + '</strong>' +
      '<p class="fate-desc">' + FATE_TEXT[tier.tier] + '</p>' +
      (FATE_QUOTE[tier.tier] ? '<p class="fate-quote">“' + FATE_QUOTE[tier.tier] + '” <span>— 돼장</span></p>' : '') +
      (fch ? '<i class="ch ch-' + fch + ' fate-ch" role="img" aria-label="' + CHAR_NAME[fch] + ' 캐릭터"></i>' : '') + '</section>';
    var hist = work.weeks.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).filter(function (w) {

    });
    if (!hist.length) return wrap(out + '<div class="card empty"><b>아직 편성된 경기가 없어요</b></div>');
    out += '<div class="card"><h3>경기 기록</h3><div class="hist">' + hist.map(function (w) {
      var lines = '';
      groups().concat([{ id: null }]).forEach(function (g) {
        var ms = w.matches.filter(function (m) { return g.id ? m.pool === g.id : poolOrder(m.pool) === 99; });
        ms.forEach(function (m, i) {
          var side = m.a.indexOf(me.id) >= 0 ? 'a' : m.b.indexOf(me.id) >= 0 ? 'b' : null;
          if (!side) return;
          var mate = m[side].filter(function (p) { return p !== me.id; }).map(function (p) { return P[p] ? P[p].name : '?'; }).join('');
          var opp = m[side === 'a' ? 'b' : 'a'].map(function (p) { return P[p] ? P[p].name : '?'; }).join('·');
          var r = !L.isOfficial(m, me.id) ? '<span class="r p">추가출전</span>' : !m.win ? '<span class="r p">대기</span>' : m.win === side ? '<span class="r w">승</span>' : '<span class="r l">패</span>';
          lines += '<div class="hist-line"><span class="no num">' + (g.id ? i + 1 + '경기' : '경기') + '</span><span>' + esc(mate) + '와 · vs ' + esc(opp) + '</span>' + r + '</div>';
        });
      });
      return '<div class="hist-week"><b class="num">' + md(w.date) + '(수)</b>' + lines + '</div>';
    }).join('') + '</div></div>';
    return wrap(out);
  }

  // ---------- 돼블스플랜(승부 예측) ----------
  // 마감 전: 집계(인원·비율)와 이름 없는 최근 예측 목록만 서버에서 읽고, 내 제출은 이 기기에도 보관
  // 마감 후: 전원 예측(predictions)을 읽어 경기 결과로 채점. 보너스는 저장하지 않고 매번 계산
  var PRED_KEY = 'ddw-pred';
  var MODE_LABEL = { high: '하이리스크', safe: '안전형' };
  var pred = { week: null, ok: null, counts: [], events: [], close: [], at: 0, sig: '', loading: false, closedAt: {}, watch: null,
    all: [], allOk: null, newEvent: 0, admWeek: null, admList: null, admErr: '' };
  ui.pred = { mode: '', picks: [], filter: '', view: 'team', more: false, edit: false, busy: false, confirm: false, full: false, adm: null, admDel: '' };

  function predWeek() { var w = getWeek(ui.week); return w && w.published !== false && w.matches.length ? w : null; }
  function isClosed(d) { return L.isPredictionClosed(d, Date.now()); }
  function localPreds() { try { var o = JSON.parse(LS.get(PRED_KEY) || '{}'); return o && typeof o === 'object' ? o : {}; } catch (e) { return {}; } }
  function localPred(d, pid) { var a = localPreds()[d]; return (a && pid && a[pid]) || null; }
  function setLocalPred(d, pid, v) {
    var a = localPreds();
    a[d] = a[d] || {}; a[d][pid] = v;
    Object.keys(a).sort().slice(0, -8).forEach(function (k) { delete a[k]; }); // 최근 8주만
    LS.set(PRED_KEY, JSON.stringify(a));
  }
  function matchLabel(w, m) {
    var same = w.matches.filter(function (x) { return x.pool === m.pool; });
    return (poolOrder(m.pool) === 99 ? '' : gname(m.pool) + ' ') + (same.indexOf(m) + 1) + '경기';
  }
  // 짧은 이름(성 빼고, 겹치면 성까지, logic.shortNames): 내 예측 카드에서만 씀. 나머지는 성까지 (2026-11-22)
  var SN = null;
  function sname(pid, P) { if (!SN) SN = L.shortNames(work.players); return SN[pid] || (P && P[pid] ? P[pid].name : '?'); }
  // 조 표시: 점·조 이름 대신 조 캐릭터 얼굴 (화면 읽기용 이름은 조 이름)
  function gface(pool) { var k = GROUP_FACE[pool]; return k ? '<i class="face face-' + k + '" role="img" aria-label="' + esc(gname(pool)) + '"></i>' : ''; }
  function teamText(m, side, P) { return m ? m[side].map(function (p) { return P[p] ? P[p].name : '?'; }).join('·') : '(빠진 경기)'; }
  // 내 예측 카드만 이름만 (사용자 요청 2026-11-22: 나머지는 성까지)
  function shortTeam(m, side, P) { return m ? m[side].map(function (p) { return P[p] ? sname(p, P) : '?'; }).join('·') : '(빠진 경기)'; }
  function matchById(w, id) { return w.matches.filter(function (m) { return m.id === id; })[0] || null; }
  function bonusMap() { return pred.allOk ? L.bonusByPlayer(work, pred.all) : {}; }
  function fmtLeft(ms) {
    var s = Math.max(0, Math.floor(ms / 1000)), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    var p2 = function (n) { return (n < 10 ? '0' : '') + n; };
    return d ? d + '일 ' + h + '시간' : h + ':' + p2(m) + ':' + p2(x); // 하루 넘게 남으면 초는 생략
  }
  function hhmm(t) { try { return new Date(t).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Seoul' }); } catch (e) { return ''; } }
  function pct(x) { return Math.round(x * 100); }
  // 다승왕권·동률 추첨 표시: 글자 없이 왕관 아이콘만 (사용자 요청 2026-11-20). 이름은 화면 읽기용으로만
  function crown(label) { return '<svg class="crown" viewBox="0 0 24 24" role="img" aria-label="' + label + '"><title>' + label + '</title><path d="M3 8.5l4.6 3.9L12 5l4.4 7.4L21 8.5 19.4 18H4.6z"/><rect x="4.6" y="19.2" width="14.8" height="2.3" rx="1"/></svg>'; }
  function signed(n) { return n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0'; }
  function resultLabel(s, mode) {
    var b = L.PREDICT.bonus[mode] || { hit: 0, miss: 0 };
    if (s.status === 'hit') return '적중 +' + b.hit + '승';
    if (s.status === 'miss') return '실패 ' + (b.miss ? '−' + Math.abs(b.miss) + '승' : '0');
    if (s.status === 'check') return '확인 필요';
    return '진행 중 ' + s.picks.filter(function (p) { return p.result === 'hit'; }).length + '/' + L.PREDICT.picks;
  }
  var PK_ICON = { hit: '✓', miss: '✕', pending: '', check: '!' }, PK_SR = { hit: '적중', miss: '실패', pending: '대기', check: '확인 필요' };
  // grp: 내 예측 카드에서 픽마다 조 색 테두리로 어느 조 경기인지 구분 (사용자 요청 2026-11-20, 글자 라벨 대신)
  function pickCells(w, s, P, small, grp) {
    var ord = function (p) { var m = matchById(w, p.match); return m ? poolOrder(m.pool) * 100 + w.matches.indexOf(m) : 1e4; };
    return '<div class="pick4' + (small ? ' sm' : '') + (grp ? ' grp' : '') + '">' + s.picks.slice().sort(function (x, y) { return ord(x) - ord(y); }).map(function (p) {
      var m = matchById(w, p.match);
      var face = m ? gface(m.pool) : '';   // 조는 얼굴 아이콘 (점·조 이름 없이)
      // ✓·✕는 이름 오른쪽, 대기는 아이콘 없이 (진행 중 코트는 맨 위 '지금 코트'에 표시, 2026-11-22)
      var icon = PK_ICON[p.result] ? '<i class="pk-res" aria-hidden="true">' + PK_ICON[p.result] + '</i>' : '';
      return '<span class="pk ' + p.result + (grp && m ? ' g' + m.pool : '') + '">' + face + '<span>' + esc(grp ? shortTeam(m, p.side, P) : teamText(m, p.side, P)) + '</span>' + icon + '<span class="sr">' + PK_SR[p.result] + '</span></span>';
    }).join('') + '</div>';
  }

  // 이번 주 내 예측: 마감 뒤엔 서버의 전원 공개 목록, 마감 전엔 이 기기에 저장한 것
  function myPredFor(w) {
    if (!ui.me) return null;
    if (isClosed(w.date)) return pred.allOk ? pred.all.filter(function (p) { return p.week_date === w.date && p.player_id === ui.me; })[0] || null : null;
    return localPred(w.date, ui.me);
  }
  function liveText(lv) {
    if (lv.status === 'hit') return '적중 확정 +' + lv.bonus + '승';
    if (lv.status === 'miss') return '실패 확정 ' + (lv.bonus ? '−' + Math.abs(lv.bonus) + '승' : '· 0승');
    if (lv.status === 'check') return '편성이 바뀐 경기가 있어요 · 돼장 확인 중';
    return '남은 ' + lv.left + '경기 다 맞히면 +' + lv.ifAllHit + '승';
  }
  // 이번 주 탭 맨 위 '내 예측' (돼장이 결과를 저장하면 Realtime으로 바로 바뀜)
  function myPredCard(w, p, lv, P) {
    if (!p) return isClosed(w.date) ? '' : '<div class="card my-pred mini"><p class="small">이번 주 예측을 아직 안 했어요. <button class="link" data-act="tab" data-v="plan">돼블스플랜 하러 가기</button></p></div>';
    return '<div class="card my-pred live ' + lv.status + '"><div class="mp-head"><h3>내 예측</h3><span class="mchip ' + p.mode + '">' + MODE_LABEL[p.mode] + '</span><span class="mp-score num">' + lv.hits + '/' + L.PREDICT.picks + ' 적중</span></div>' +
      pickCells(w, L.scorePrediction(p, w), P, false, true) + '<b class="pred-res ' + lv.status + '">' + liveText(lv) + '</b></div>';
  }
  // ---------- 경기 진행(코트 3칸) ----------
  // 코트·결과는 app_state(돼장 저장), 자리 비움은 availability 테이블. 둘 다 Realtime(안 되면 20초마다 다시 읽기)
  var live = { week: null, rows: [], ok: null, watch: null, at: 0, stateAt: 0 };
  var AWAY_LABEL = { late: '늦음', away: '레슨 중', out: '오늘 못 함' };   // 레슨은 '왔어요'를 누를 때까지 (자동 복귀 없음)
  function isMatchDay(d) { return d === todayKST(); }
  function liveRows() { return live.week === ui.week && live.ok ? live.rows : []; }
  function loadAvail(d) {
    return remote.availability(d).then(function (rows) { if (live.week === d) { live.rows = rows || []; live.ok = true; live.at = Date.now(); } },
      function () { if (live.week === d) { live.ok = false; live.at = Date.now(); } });
  }
  // 돼장 저장을 받아 옴: 내가(돼장) 저장 안 한 변경이 있으면 건드리지 않음(저장할 때 기존 충돌 안내로 처리)
  function reloadState() {
    if (dirty() || ui.busy) return Promise.resolve(false);
    live.stateAt = Date.now();
    return remote.load().then(function (s) {
      if (dirty() || ui.busy || s.rev === saved.rev) return false;
      saved = s; work = clone(s); return true;
    }, function () { return false; });
  }
  function ensureLive(d) {
    if (live.week === d) return;
    if (live.watch) { live.watch.stop(); live.watch = null; }
    live.week = d; live.rows = []; live.ok = null;
    if (!isMatchDay(d)) return;
    loadAvail(d).then(render);
    var t = null;

    // 2. 편성
    out += '<div class="card"><div class="row" style="justify-content:space-between"><h2>편성</h2><button class="btn primary" data-act="gen-all"' + (attIds.length < 4 ? ' disabled' : '') + '>전체 자동 편성</button></div>' +
      '<p class="small muted">조마다 직전 참가 주 성적이 같은 사람끼리 묶어요(전승은 지옥도, 전패는 천국도). 전원 공식 2경기에 파트너가 겹치지 않게 짜고, 홀수 인원이면 2명이 추가출전(기록 제외)해요. 누를 때마다 새 편성이 나와요.</p>';

    // 조별 메뉴바: 한 번에 한 조만 보여 줌

      if (x.match) { var mm = w.matches.filter(function (m) { return m.id === x.match; })[0]; return mm ? mm.pool : null; }

      if (pool.length) out += '<p class="small"><span class="muted">실력순 </span>' + pool.slice().sort(function (x, y) { return L.strengthOf(work, y, w.date, g.id) - L.strengthOf(work, x, w.date, g.id); }).map(function (id) {

      }).join(' ') + '</p>';
      ms.forEach(function (m, i) { out += editMatch(m, i, w, attIds, P); });

    })(pg);

  }

  // ---------- 돼장 요청: 글로 적으면 Claude가 조건·수정 계획을 만들고, 미리 보고 적용 ----------
  function matchLine(m, P) {
    var n = function (t) { return t.map(function (p) { return P[p] ? P[p].name : '빈 자리'; }).join('·'); };

  function viewAi(w, attIds) {

      '<p class="small muted">자동 편성을 어떻게 고칠지 글로 적어 보내면 Claude가 고쳐 줘요. 예) "철수·영희 같은 팀 금지", "A조 3경기 민수랑 지훈 바꿔줘", "추가출전은 지훈 말고 다른 사람". 미리 보고 <b>적용</b>을 눌러야 바뀌어요.</p>';
    if (rules.length) {
      out += '<p class="small" style="margin-bottom:4px"><b>이번 주 조건</b> <span class="muted">자동 편성을 다시 눌러도 지켜요</span></p><div class="plist">' + rules.map(function (r) {
        return '<div class="prow"><span class="small">' + esc(L.ruleText(work, r)) + '</span><span></span><button class="btn sm" data-act="rule-del" data-r="' + esc(r.id) + '">지우기</button></div>';
      }).join('') + '</div>';
    }
    out += '<label class="f" for="ai-text">요청<textarea id="ai-text" maxlength="500" placeholder="예) 박강호랑 조영재는 같은 팀 하지 말아 줘">' + esc(ai.text) + '</textarea></label>' +
      '<div class="row"><button class="btn primary" data-act="ai-send"' + (ai.busy || attIds.length < 4 ? ' disabled' : '') + '>보내기</button>' +
      (ai.busy ? '<span class="small">Claude가 편성을 고치는 중이에요… (보통 10~40초)</span>' : '') + '</div>';
    if (ai.err) out += '<div class="banner warn" role="alert"><span>' + esc(ai.err) + '</span></div>';
    var res = ai.res;
    if (res) {
      var nw = res.out.week, before = res.before;
      var kept = function (m) { return before.matches.some(function (b) { return b.id === m.id && same2(b, m); }); };
      out += '<div class="ai-preview"><p class="ai-say">' + esc(res.explanation || '요청을 반영한 편성이에요.') + '</p>';
      var added = (nw.rules || []).filter(function (r) { return !(before.rules || []).some(function (b) { return b.id === r.id; }); });
      if (added.length) out += '<p class="small"><b>추가할 조건</b> ' + added.map(function (r) { return esc(L.ruleText(work, r)); }).join(', ') + '</p>';
      var changed = groups().filter(function (g) {
        var a = nw.matches.filter(function (m) { return m.pool === g.id; }), b = before.matches.filter(function (m) { return m.pool === g.id; });
        return a.length !== b.length || a.some(function (m) { return !kept(m); });
      });
      if (!changed.length && !added.length && !res.out.errors.length) out += '<p class="small muted">바뀌는 경기가 없어요.</p>';
      changed.forEach(function (g) {
        out += '<h3 class="gdot g' + g.id + '">' + esc(g.name) + (res.out.regenerated.indexOf(g.id) >= 0 ? ' <span class="muted small">다시 짬</span>' : '') + '</h3><div class="plist">' +
          nw.matches.filter(function (m) { return m.pool === g.id; }).map(function (m, i) {
            return '<div class="ai-line' + (kept(m) ? '' : ' changed') + '"><span class="num">' + (i + 1) + '경기</span><span>' + matchLine(m, P) + '</span>' + (kept(m) ? '' : '<span class="chip lot">바뀜</span>') + '</div>';
          }).join('') + '</div>';
      });
      var issues = L.validateWeek(work, nw);
      var lost = res.out.regenerated.map(function (gid) {
        var n = before.matches.filter(function (m) { return m.pool === gid && m.win; }).length;
        return n ? '<li class="error">' + esc(gname(gid)) + '조에 입력된 결과 ' + n + '경기가 새 편성으로 바뀌면서 지워져요.</li>' : '';
      }).join('');
      out += '<ul class="issues">' + lost + res.out.errors.map(function (e) { return '<li class="error">반영 못 한 것: ' + esc(e) + '</li>'; }).join('') +
        (res.out.warnings || []).map(function (e) { return '<li class="warn">' + esc(e) + '</li>'; }).join('') +
        (issues.length ? issues.map(function (x) { return '<li class="' + x.level + '">' + esc(x.msg) + '</li>'; }).join('') : '<li class="ok">점검 통과: 전원 공식 2경기, 파트너 중복 없음' + ((nw.rules || []).length ? ', 조건 지킴' : '') + '</li>') + '</ul>' +
        (changed.length || !same(nw.rules || [], before.rules || [])

          : '<div class="row"><button class="btn" data-act="ai-cancel">닫기</button></div>') + '</div>';

    return out + '</div>';
  }
  function same2(a, b) { return same([a.a, a.b, a.off || []], [b.a, b.b, b.off || []]); }

  function tmpId() { return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }

  function aiSend() {

  function seedsObj() { return L.decodeSeeds(work.settings.seeds); }

  function seedList(gid) {

      '<p class="small muted">잘하는 순서예요. 자동 편성 때 두 팀 실력 합을 맞추는 데 쓰고, 경기가 쌓이면 실제 승률 비중이 점점 커져요(6경기쯤 반반). 회원 화면에는 나오지 않아요.</p>' +
      '<label class="f" for="seed-text">한 번에 입력 (한 줄에 한 명, 잘하는 순서대로)<textarea id="seed-text" placeholder="1. 유성준&#10;2. 김성곤&#10;3. 조영재">' + esc(ui.seedText[gid] || '') + '</textarea></label>' +
      '<div class="row"><button class="btn primary" data-act="seed-apply">이 순서로 덮어쓰기</button>' + (list.length ? '<button class="btn sm danger" data-act="seed-clear">순위 비우기</button>' : '') + '</div>';
    if (list.length) {

      }).catch(function (e) {
        pinBusy = false;
        ui.pinMsg = e.code === 'no_pin' ? '관리 PIN이 아직 설정되지 않았어요. 설치 안내(README)대로 PIN을 먼저 정해 주세요.' :
          e.code === 'network' ? '인터넷 연결을 확인하고 다시 해 주세요.' : '잠금을 해제하지 못했어요 (' + e.code + ').';
        render();
      });
    } else if (f.id === 'court-form') {
      var nums = document.getElementById('court-nums').value.split(/[,\s]+/).filter(Boolean).map(Number);
      if (!nums.length || nums.some(function (n) { return !(n >= 1 && n <= 99 && n === Math.floor(n)); }) || new Set(nums).size !== nums.length) { toast('1~99 숫자를 쉼표로 나눠 적어 주세요 (예: 5, 6).'); return; }
      work.settings.courts = nums; save();
    } else if (f.id === 'op-pin-form') {
      var np = document.getElementById('op-pin').value;
      if (!/^\d{4}$/.test(np)) { toast('숫자 4자리를 입력하세요.'); return; }
      remote.setOperatorPin(token, np).then(function () { document.getElementById('op-pin').value = ''; toast('진행 PIN을 정했어요. 도우미에게 알려 주세요.'); }, function (e) {
        toast(e.code === 'same_as_admin' ? '관리 PIN과 다른 번호로 정해 주세요.' : e.code === 'unauthorized' ? '관리자 로그인이 만료됐어요. PIN을 다시 입력해 주세요.' : '진행 PIN을 정하지 못했어요 (' + e.code + ').');
      });
    } else if (f.id === 'pin-change') {
      var o = document.getElementById('pc0').value, a = document.getElementById('pc1').value, b = document.getElementById('pc2').value;
      if (!/^\d{4}$/.test(o)) { toast('지금 PIN 4자리를 입력하세요.'); return; }
      if (!/^\d{4}$/.test(a) || a !== b) { toast('새 PIN 4자리를 두 번 똑같이 입력하세요.'); return; }
      remote.changePin(token, o, a).then(function () {
        toast('PIN을 바꿨어요. 다른 기기에서는 새 PIN을 다시 입력해야 해요.');
      }, function (e) {
        if (e.code === 'bad_pin') toast('지금 PIN이 맞지 않아요.');
        else if (e.code === 'same_as_operator') toast('진행 PIN과 다른 번호로 정해 주세요.');
        else if (e.code === 'unauthorized') { dropAdmin(); ui.admin = false; ui.pinMsg = '관리자 로그인이 만료됐어요. PIN을 다시 입력하세요.'; render(); }
        else toast('PIN을 바꾸지 못했어요 (' + e.code + ').');
      });
    } else if (f.id === 'add-player') {
      var nm = document.getElementById('np-name').value.trim(), g = document.getElementById('np-group').value;
      if (!nm) return;
      if (work.players.some(function (p) { return p.name === nm; })) { toast('같은 이름이 이미 있어요.'); return; }
      work.players.push({ id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: nm, group: g });
      commit(); toast(nm + ' 선수를 추가했어요.');
    }
  });

  // ---------- 시작: Supabase에서 state 읽기 ----------
  function bootView(msg, retry) {
    document.getElementById('app').innerHTML = '<main><div class="card empty"><div class="pig" aria-hidden="true"></div><b>' + esc(msg) + '</b>' +
      (retry ? '<p class="muted">인터넷 연결을 확인하고 다시 시도해 주세요.</p><button class="btn primary" data-act="retry">다시 시도</button>' : '') + '</div></main>';
  }
  // 화면을 그리다 오류가 나면 '불러오는 중'에 멈추지 않고 오류 내용과 다시 시도 (2026-11-27 폰에서 멈춘 일)
  function bootError(e) {
    if (window.console) console.error(e);
    document.getElementById('app').innerHTML = '<main><div class="card empty"><div class="pig" aria-hidden="true"></div><b>화면을 그리지 못했어요</b>' +
      '<p class="muted small">' + esc(String((e && e.message) || e).slice(0, 200)) + '</p>' +
      '<div class="row" style="justify-content:center"><button class="btn primary" data-act="retry">다시 시도</button><button class="btn" data-act="boot-reset">처음 상태로 열기</button></div>' +
      '<p class="muted small">계속 이러면 이 화면을 캡처해서 보내 주세요.</p></div></main>';
  }
  function start(state) {
    saved = state; work = clone(saved);
    restoreDraft();
    if (!ui.week || seasonDates().indexOf(ui.week) < 0) ui.week = defaultWeek();
    // 첫 화면: 늘 홈 (2026-11-27). 경기날이면 다승왕에 들어갔을 때 바로 그날 주가 보이게
    ui.tab = L.startTab(LS.get(KEY.tab), todayKST(), seasonDates());
    if (seasonDates().indexOf(todayKST()) >= 0) ui.week = todayKST();
    var sess = R.loadSession(LS, Date.now());
    token = sess ? sess.token : null;
    ui.admin = !!sess && sess.role === 'admin'; ui.op = !!sess && sess.role === 'operator';
    // 회원 로그인: 기억한 토큰이 있으면 먼저 그대로 열고 서버에서 확인(초기화·쉬는 회원이면 다시 로그인).
    // 토큰은 없지만 예전에 고른 이름이 있으면(로그인 생기기 전 사용자) 그 이름의 비밀번호 단계부터
    member.token = LS.get(MKEY);
    var meP = pm()[ui.me];
    member.ok = !!(member.token && meP && meP.active !== false);
    if (!member.ok && meP && meP.active !== false) { ui.lg.gid = meP.group; ui.lg.step = 'name'; }
    render();
    if (!member.ok && meP && meP.active !== false) lgPick(meP.id);
    if (member.token) remote.memberCheck(member.token).then(function (pid) {
      if (!pid) { memberOut('다시 로그인해 주세요.'); return; }
      if (pid !== ui.me || !member.ok) { ui.me = pid; LS.set(KEY.me, pid); member.ok = true; render(); }
    }, function () { });
    // 돼블스플랜: 마감된 주의 예측(보너스 계산용), 카운트다운·다시 읽기 타이머
    loadAllPreds().then(render);
    setInterval(predTick, 1000);
    // 참가 탭·홈을 보고 있으면 30초마다 명단 새로 (다른 사람 신청·취소 반영)
    setInterval(function () { if (member.ok && (ui.tab === 'signup' || ui.tab === 'home') && document.visibilityState === 'visible' && !sg.busy) loadSignups(); }, 30000);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && pred.week) { refreshPred(); loadAllPreds().then(render); } });
    // 기억한 토큰이 만료·무효(PIN 변경 등)면 PIN 입력 화면으로
    if (token) remote.liveCheck(token).then(function (role) {
      if (!role) { dropAdmin(); ui.admin = false; render(); return; }
      if ((role === 'admin') !== ui.admin) { ui.admin = role === 'admin'; ui.op = role === 'operator'; render(); }
    }, function () { });
  }
  try { remote = R.connect(window.DDW_CONFIG, window.supabase); }
  catch (e) { bootView(e.code === 'config' ? 'config.js에 Supabase 주소와 키를 넣어 주세요.' : '데이터를 불러오지 못했어요.', e.code !== 'config'); return; }
  pushInit();
  // 15초 넘게 못 받으면 다시 시도 버튼 (나중에라도 받으면 그대로 앱이 열림)
  var bootTimer = setTimeout(function () { if (!saved) bootView('불러오는 데 오래 걸려요.', true); }, 15000);
  remote.load().then(function (s) { clearTimeout(bootTimer); try { start(s); } catch (e) { bootError(e); } }, function (e) { clearTimeout(bootTimer); if (window.console) console.error(e); bootView('데이터를 불러오지 못했어요.', true); });
})();
</script><script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { });</script></body></html>
