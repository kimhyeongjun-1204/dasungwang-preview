/* 라켓뚱보단 다승왕전 — 디자인 시스템
   레이아웃: 폰 우선 단일 컬럼(최대 720px).
   원칙: 이벤트 영역(상단 배너, 조별 섹션 캐릭터, 지옥도·천국도 표지판)만 화려하게,
         정보 영역(카드·탭·목록·관리)은 흰 카드 + 얇은 테두리 + 네이비/노랑 제한 사용.
   밝은 테마 하나로 고정(포스터 세계관 유지). */
:root {
  color-scheme: light;
  /* 중립 */
  --bg: #F4F7FC;
  --surface: #FFFFFF;
  --surface-2: #F8FAFD;
  --line: #DCE2EC;
  --line-2: #EBEFF5;
  --text: #202535;
  --text-2: #626C80;
  /* 브랜드 */
  --navy: #20264F;
  --navy-50: #EEF0F8;
  --yellow: #FFC928;
  --yellow-50: #FFF7DB;
  /* 상태·이벤트 */
  --hell: #D94343;
  --hell-50: #FCECEC;
  --heaven: #3478D4;
  --heaven-50: #EAF2FC;
  --win: #21865B;
  --win-50: #E8F5EE;
  --danger: #D64545;
  --danger-50: #FDEEEE;
  /* 작은 글자용 진한 변형 (명도 대비 4.5:1 이상) */
  --hell-text: #B42F2F;
  --heaven-text: #2A66B8;
  --win-text: #1B7350;
  /* 돼블스플랜 (이벤트 비주얼 전용, 대비는 명세 측정값) */
  --plan-bg: #14080D;   /* 예측 배너·마감 리포트 배경 */
  --plan: #F02068;      /* 어두운 배경 위 강조(4.78:1). 흰 글씨는 18px 볼드 이상만(4.11:1) */
  --plan-text: #C2185B; /* 흰 카드 위 작은 핑크 글씨·칩(5.87:1) */
  /* 조 포인트(얇은 선·점에만) */
  --gA: #B8403A;
  --gB: #2E8B57;
  --gC: #D2648A;
  /* 글꼴 */
  --font-brand: "Black Han Sans", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  /* 크기 체계 */
  --fs-cap: 12px; --fs-sm: 13px; --fs-body: 15px; --fs-h3: 15px; --fs-h2: 17px; --fs-h1: 20px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px;
  --r-card: 12px; --r-ctl: 8px; --r-badge: 6px;
  --shadow: 0 1px 2px rgb(32 38 79 / .05);
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--fs-body); line-height: 1.55; -webkit-text-size-adjust: 100%; }
#app { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 150px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--heaven); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3, p, dl, dd { margin: 0; }
h2 { font-size: var(--fs-h2); font-weight: 700; line-height: 1.35; text-wrap: balance; }
h3 { font-size: var(--fs-h3); font-weight: 700; }
.muted { color: var(--text-2); }
.small { font-size: var(--fs-sm); }
main { display: grid; gap: var(--sp-4); padding-top: var(--sp-4); }

/* ---------- 이벤트 배너 (브랜드 영역) ---------- */
.hero { position: relative; overflow: hidden; border-radius: 16px; color: #fff; min-height: 120px;
  background: linear-gradient(110deg, #5E0F0B 0%, #B9261A 34%, var(--hell) 48%, #F2A33A 49.6%, #63C7E8 50.4%, var(--heaven) 66%, #173C7A 100%);
  display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 14px; align-items: center; padding: 16px 16px 26px; box-shadow: 0 4px 14px rgb(32 38 79 / .18); }
.hero::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    /* 왼쪽(지옥도): 바닥에서 올라오는 불빛 + 작은 불티 몇 개 */
    radial-gradient(circle at 10% 120%, rgb(255 190 60 / .35), transparent 45%),
    radial-gradient(1.6px 1.6px at 5% 30%, rgb(255 210 120 / .85), transparent),
    radial-gradient(1.2px 1.2px at 12% 14%, rgb(255 180 90 / .7), transparent),
    radial-gradient(1.8px 1.8px at 3% 62%, rgb(255 200 110 / .6), transparent),
    radial-gradient(1.2px 1.2px at 22% 8%, rgb(255 220 150 / .55), transparent),
    /* 가운데 경계: 지옥 불빛과 하늘이 만나는 부드러운 빛 번짐 */
    radial-gradient(18% 70% at 50% 50%, rgb(255 236 200 / .16), transparent 70%),
    /* 오른쪽(천국도): 위에서 내려오는 빛 + 가장자리 옅은 구름 */
    radial-gradient(circle at 95% -20%, rgb(255 255 255 / .32), transparent 42%),
    radial-gradient(22% 30% at 88% 92%, rgb(255 255 255 / .16), transparent 70%),
    radial-gradient(16% 24% at 97% 74%, rgb(255 255 255 / .14), transparent 70%),
    radial-gradient(14% 20% at 78% 104%, rgb(255 255 255 / .12), transparent 70%); }
.pig { width: 88px; height: 88px; border-radius: 50%; background: var(--img-pig) center / cover, #FFD1DC; border: 3px solid #fff; box-shadow: 0 2px 8px rgb(0 0 0 / .25); position: relative; z-index: 1; }
.hero-txt { position: relative; z-index: 1; min-width: 0; display: grid; gap: 4px; justify-items: start; }
.kicker { font-size: var(--fs-cap); font-weight: 700; background: rgb(0 0 0 / .35); border-radius: var(--r-badge); padding: 1px 8px; }
.title { font-family: var(--font-brand); font-weight: 400; font-size: clamp(34px, 9.5vw, 44px); line-height: 1; color: var(--yellow); -webkit-text-stroke: 6px #4A0D06; paint-order: stroke fill; text-shadow: 0 3px 0 #4A0D06; }
.title small { font-size: .5em; color: #fff; margin-left: 4px; -webkit-text-stroke-width: 4px; }
.tagline { font-size: var(--fs-sm); font-weight: 700; }
.tagline b { color: var(--yellow); }
.hero-side { position: absolute; bottom: 6px; z-index: 1; font-family: var(--font-brand); font-size: 13px; letter-spacing: .04em; opacity: .9; }
.hero-side.hell { left: 16px; }
.hero-side.heaven { right: 16px; }

/* 시즌 진행 (차분한 정보 줄) */
.season { margin-top: var(--sp-3); display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; font-size: var(--fs-cap); color: var(--text-2); }
.season-label { font-weight: 700; color: var(--text); }
.season-bar { display: grid; grid-template-columns: repeat(11, minmax(8px, 18px)); gap: 3px; flex: 1 1 140px; max-width: 240px; }
.season-bar i { height: 6px; border-radius: 3px; background: var(--line); }
.season-bar i.done { background: var(--win); }
.season-bar i.part { background: var(--yellow); }
.season-bar i.sel { outline: 2px solid var(--navy); outline-offset: 1px; }

/* ---------- 상단 탭 ---------- */
.tabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 6; margin-top: var(--sp-3); display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: 0 2px 8px rgb(32 38 79 / .06); }
.tabs button { border: 0; background: none; border-radius: var(--r-ctl); padding: 9px 2px; font-size: 14px; font-weight: 500; color: var(--text-2); }
.tabs button:hover { background: var(--surface-2); }
.tabs button[aria-selected="true"] { background: var(--navy); color: #fff; font-weight: 700; }
.tabs .lock { font-size: 10px; font-weight: 700; color: var(--text-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 3px; vertical-align: 1px; }

/* ---------- 공통 카드·배너·버튼 ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: var(--sp-4); display: grid; gap: var(--sp-3); min-width: 0; box-shadow: var(--shadow); }
.empty { text-align: center; justify-items: center; padding: var(--sp-5) var(--sp-4); gap: var(--sp-2); }
.empty b { font-size: 16px; font-weight: 700; }
.empty .pig, .lockcard .pig { width: 64px; height: 64px; border-color: var(--line-2); box-shadow: none; }
.lockcard { justify-items: center; text-align: center; padding: var(--sp-5) var(--sp-4); }
.banner { border-radius: var(--r-ctl); padding: 10px 12px; font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid; }
.banner.warn { background: var(--yellow-50); border-color: #F0DC9C; }
.banner.info { background: var(--navy-50); border-color: #D5DAEE; }
.row { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); background: var(--surface); color: var(--navy); border-radius: var(--r-ctl); font-size: 14px; font-weight: 700; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--yellow); border-color: var(--yellow); color: var(--navy); }
.btn.primary:hover { background: #F5BD12; }
.btn.danger { color: var(--hell-text); border-color: #F1CACA; }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: var(--r-badge); font-size: 11px; font-weight: 700; white-space: nowrap; vertical-align: 2px; border: 1px solid transparent; }
.chip.king { background: var(--yellow-50); color: #7A5600; border-color: #F0DC9C; }
.chip.lot { background: var(--navy-50); color: var(--navy); border-color: #D5DAEE; }
.chip.bal-even { background: var(--win-50); color: var(--win-text); }
.chip.bal-ok { background: var(--surface-2); color: var(--text-2); border-color: var(--line); }
.chip.bal-lopsided { background: var(--danger-50); color: var(--hell-text); }
details summary { cursor: pointer; color: var(--text-2); font-size: var(--fs-sm); font-weight: 500; padding: 4px 0; }

/* ---------- 날짜 선택 ---------- */
.weeks { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; }
.weeks button { flex: none; min-width: 64px; height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: var(--r-ctl); font-size: 13px; font-weight: 500; }
.weeks button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 700; }
.weeks .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); flex: none; }
.weeks .dot.st-done { background: var(--win); }
.weeks .dot.st-part { background: var(--yellow); }
.weeks .dot.st-plan { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }

/* ---------- 이번 주 요약 ---------- */
.daybar { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.day { font-size: var(--fs-h1); font-weight: 700; }
.facts { display: flex; gap: 16px; }
.facts div { display: grid; }
.facts dt { font-size: var(--fs-cap); color: var(--text-2); }
.facts dd { font-size: 16px; font-weight: 700; color: var(--navy); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-cap); }

/* 이름 + 지옥도/천국도 점 */
.pl { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.pl::before { content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none; display: none; }
.pl.t-hell::before { display: block; background: var(--hell); }
.pl.t-heaven::before { display: block; background: var(--heaven); }
.pl.t-mid::before { display: block; background: #A3ACBD; }
.pl.me { color: var(--heaven-text); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.x { font-style: normal; font-size: 10px; font-weight: 700; color: var(--hell-text); background: var(--hell-50); border-radius: 4px; padding: 0 4px; }
.sep { color: #B5BDCB; margin-inline: 2px; }

/* ---------- 팀 배너 (이벤트 비주얼: 배경 + 원본 캐릭터) ---------- */
.group { display: grid; gap: var(--sp-2); }
.team-banner { position: relative; overflow: hidden; display: flex; align-items: stretch; min-height: 132px; border-radius: var(--r-card); isolation: isolate; }
.tb-text { position: relative; z-index: 2; flex: 1 1 auto; min-width: 0; display: grid; align-content: space-between; gap: 10px; padding: 14px 0 14px 16px; }
.tb-name { font-family: var(--font-brand); font-weight: 400; font-size: clamp(21px, 6vw, 28px); line-height: 1.12; letter-spacing: .01em; color: var(--tb-ink); }
.tb-name span { display: inline-block; }
.tb-meta { display: flex; flex-wrap: wrap; gap: 4px; }
.tb-meta span { font-size: 12px; font-weight: 700; line-height: 1; padding: 6px 8px; border-radius: var(--r-badge); background: var(--tb-chip); color: var(--tb-chip-ink); }
.tb-chars { position: relative; z-index: 1; flex: none; display: flex; align-items: flex-end; justify-content: flex-end; padding-right: 6px; }
.ch { display: block; flex: none; height: var(--chh); background: var(--chi) center bottom / contain no-repeat; filter: drop-shadow(0 3px 4px rgb(0 0 0 / .22)); }
.ch + .ch { margin-left: -14px; }
/* 원본 비율 유지 */
.ch-cv { --chi: var(--ch-cv); aspect-ratio: 273 / 320; --chh: 118px; margin-bottom: 6px; }
.ch-lb { --chi: var(--ch-lb); aspect-ratio: 187 / 186; --chh: 96px; }
.ch-bf { --chi: var(--ch-bf); aspect-ratio: 205 / 162; --chh: 100px; }
.ch-lm { --chi: var(--ch-lm); aspect-ratio: 193 / 161; --chh: 100px; }
.ch-pk { --chi: var(--ch-pk); aspect-ratio: 182 / 159; --chh: 100px; }
.ch-ck { --chi: var(--ch-ck); aspect-ratio: 182 / 168; --chh: 100px; }
/* 코트 바닥(공통 구조, 색만 팀별) */
.team-banner::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; z-index: 0; background: var(--tb-floor); border-top: 2px solid var(--tb-line); }
.team-banner::after { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: var(--tb-deco); }
/* 캐비어·랍스터: 와인색 경기장, 절제된 불빛 */
.tb-A { --tb-ink: #FFFFFF; --tb-chip: rgb(255 255 255 / .16); --tb-chip-ink: #FFFFFF; --tb-line: rgb(255 214 170 / .35); --tb-floor: linear-gradient(180deg, rgb(120 28 34 / .55), rgb(60 10 18 / .85));
  --tb-deco: radial-gradient(60% 90% at 82% 105%, rgb(255 128 64 / .38), transparent 70%), radial-gradient(2px 2px at 64% 22%, rgb(255 200 120 / .8), transparent), radial-gradient(2px 2px at 72% 40%, rgb(255 170 90 / .7), transparent), radial-gradient(1.5px 1.5px at 90% 18%, rgb(255 220 160 / .8), transparent);
  background: repeating-linear-gradient(90deg, rgb(255 255 255 / .035) 0 1px, transparent 1px 44px), linear-gradient(135deg, #2B0B12 0%, #551321 52%, #7C1D27 100%); }
/* 소갈비·양갈비: 크림색 + 차분한 초록 코트 */
.tb-B { --tb-ink: #1F3B2C; --tb-chip: rgb(255 255 255 / .8); --tb-chip-ink: #1F3B2C; --tb-line: #FFFFFF; --tb-floor: linear-gradient(180deg, #BFDCC8, #A9CFB4);
  --tb-deco: linear-gradient(90deg, transparent calc(70% - 1px), rgb(255 255 255 / .9) calc(70% - 1px) calc(70% + 1px), transparent calc(70% + 1px)) bottom / 100% 30% no-repeat, radial-gradient(50% 70% at 80% 100%, rgb(255 255 255 / .55), transparent 70%);
  background: linear-gradient(160deg, #FBF7EB 0%, #F1F3E4 55%, #DCEBDD 100%); border: 1px solid #DCE7DA; }
/* 돼지갈비·닭갈비: 코랄·연분홍·크림, 밝고 유쾌하게 */
.tb-C { --tb-ink: #5A1A2B; --tb-chip: rgb(255 255 255 / .8); --tb-chip-ink: #5A1A2B; --tb-line: #FFFFFF; --tb-floor: linear-gradient(180deg, #FFC2B6, #FFAE9F);
  --tb-deco: radial-gradient(circle, rgb(255 255 255 / .55) 1.6px, transparent 2px) 0 0 / 18px 18px;
  background: linear-gradient(160deg, #FFF7EF 0%, #FFE6DD 55%, #FFD0C6 100%); border: 1px solid #F8DCD3; }
.tb-C::after { -webkit-mask: linear-gradient(90deg, transparent 0 45%, #000 80%); mask: linear-gradient(90deg, transparent 0 45%, #000 80%); }
@media (max-width: 599.98px) {
  /* 좁은 화면: 글자 칸 고정 → 세 팀 배너 높이 동일, 캐릭터는 화면 너비에 비례 */
  .tb-text { flex: 0 0 44%; }
  .tb-chars { flex: 1 1 auto; min-width: 0; }
  .ch + .ch { margin-left: -14px; }
  .ch-cv { --chh: clamp(96px, 29vw, 116px); }
  .ch-lb, .ch-bf, .ch-lm, .ch-pk, .ch-ck { --chh: clamp(72px, 22vw, 90px); }
  .tb-name { font-size: clamp(19px, 5.6vw, 23px); }
  .tb-name span { display: block; }
}
@media (min-width: 600px) {
  .team-banner { min-height: 148px; }
  .tb-text { padding: 18px 0 18px 22px; }
  .tb-name span { display: inline; }
  .ch-cv { --chh: 138px; } .ch-lb { --chh: 112px; } .ch-bf, .ch-lm, .ch-pk, .ch-ck { --chh: 116px; }
  .tb-chars { padding-right: 18px; }
}
.gdot { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.gdot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gc, var(--text-2)); }
.gA { --gc: var(--gA); } .gB { --gc: var(--gB); } .gC { --gc: var(--gC); }

/* ---------- 경기 카드 (공통) ---------- */
.match-list { display: grid; gap: var(--sp-2); }
.match { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 10px 12px 12px; display: grid; gap: 8px; box-shadow: var(--shadow); }
.m-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.m-no { font-size: var(--fs-sm); font-weight: 700; color: var(--navy); }
.m-state { font-size: var(--fs-cap); color: var(--text-2); }
.m-state.done { color: var(--win-text); }
.m-teams { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: stretch; }
.team { display: flex; align-items: center; justify-content: center; position: relative; gap: 6px; min-height: 48px; padding: 8px 64px; border: 1px solid var(--line-2); background: var(--surface-2); border-radius: var(--r-ctl); text-align: left; width: 100%; font-size: 15px; font-weight: 500; color: var(--text); }
button.team:hover { border-color: var(--line); background: #F1F4F9; }
.team .names { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px 4px; min-width: 0; text-align: center; }
.team .res { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); }  /* 이름은 가운데, WIN·패는 오른쪽 (2026-11-22) */
.team.win { background: var(--win-50); border-color: #BFE3CF; font-weight: 700; }
.team.lose { background: var(--surface); color: var(--text-2); }
.res { flex: none; font-size: 11px; font-weight: 700; border-radius: var(--r-badge); padding: 2px 6px; }
.win-badge { background: var(--win); color: #fff; }
.lose-txt { color: var(--text-2); }
.tap { color: var(--text-2); font-weight: 500; border: 1px dashed var(--line); }
.vs { align-self: center; font-size: var(--fs-cap); font-weight: 700; color: var(--text-2); }
@media (max-width: 520px) {
  .m-teams { grid-template-columns: 1fr; gap: 4px; }
  .vs { justify-self: center; line-height: 1; }
}

.allset { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 14px 16px; }
.ok-ico { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--win-50); color: var(--win-text); font-weight: 700; }
.allset strong { font-size: 16px; color: var(--navy); }
.allset p { font-size: var(--fs-sm); color: var(--text-2); }
.allset .note { color: var(--hell-text); }

/* ---------- 조 선택 (순위·편성·실력 순위 공통) ---------- */
.gsel { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.gsel button { display: grid; justify-items: center; gap: 2px; padding: 8px 4px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: var(--r-ctl); font-size: 14px; font-weight: 700; line-height: 1.25; }
.gsel button::before { content: ""; width: 18px; height: 3px; border-radius: 2px; background: var(--gc); }
.gsel button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.tab-sub { display: block; font-size: 11px; font-weight: 500; color: var(--text-2); }
.gsel button[aria-pressed="true"] .tab-sub { color: rgb(255 255 255 / .8); }
.tab-warn { font-style: normal; display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; background: var(--yellow); color: var(--navy); font-size: 10px; font-weight: 700; vertical-align: 1px; }
.plan-tabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 4; background: var(--surface); padding-block: 4px; }

/* ---------- 순위 ---------- */
.rank-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.board { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; box-shadow: var(--shadow); }
.rrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px 32px 48px 32px; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line-2); }
.rrow.rhead { border-top: 0; padding-block: 8px; background: var(--surface-2); font-size: var(--fs-cap); color: var(--text-2); font-weight: 500; }
.rrow.rhead span:nth-child(n+3) { text-align: right; }
.rrow.rhead span { white-space: nowrap; }
.rrow.contender { background: var(--yellow-50); }
.rrow.me .rname b { color: var(--heaven-text); }
.medal { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--navy); background: var(--line-2); }
.medal.m1 { background: var(--yellow); }
.medal.m2 { background: #DDE2EA; }
.medal.m3 { background: #F1D6BE; }
.rname { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; }
.rname b { font-size: 15px; font-weight: 700; }
.rname .sub { flex-basis: 100%; font-size: var(--fs-cap); color: var(--text-2); word-break: keep-all; }  /* 낱말 중간에서 안 끊기게 */
.rname .sub .nw { white-space: nowrap; }  /* '결과 대기 N경기'는 한 덩어리로 줄바꿈 */
.rnum { text-align: right; font-size: 14px; color: var(--text-2); }
.rnum.strong { font-size: 17px; font-weight: 700; color: var(--navy); }

/* ---------- 내 기록 ---------- */
label.f { display: grid; gap: 4px; font-size: var(--fs-sm); font-weight: 500; color: var(--text-2); }
.me-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.me-head h2 { font-size: var(--fs-h1); }
.stat-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r-ctl); padding: 10px 12px; display: grid; gap: 2px; }
.stat b { font-size: 22px; font-weight: 700; color: var(--navy); line-height: 1.2; }
.stat span { font-size: var(--fs-cap); color: var(--text-2); }
/* 내 기록 총합 내역: 공식 승 + 예측 승 | 패 */
.rec-split { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) minmax(0, 1fr); align-items: center; margin-top: 8px; padding: 10px 4px; text-align: center; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r-ctl); }
.rec-split > div { display: grid; gap: 2px; justify-items: center; }
.rec-split span { font-size: var(--fs-cap); color: var(--text-2); }
.rec-split b { font-size: 20px; font-weight: 700; line-height: 1.2; color: var(--text); }
.rec-split i { font-style: normal; font-weight: 700; color: var(--text-2); }
.rec-split small { font-size: 11px; color: var(--text-2); white-space: nowrap; }
.rec-split .pwin.plus b { color: var(--win-text); }
.rec-split .pwin.minus b { color: var(--hell-text); }
.rec-split .loss { border-left: 1px solid var(--line); }
.me-zone .stat.total b { font-size: 26px; }
.stat.hl { background: var(--yellow-50); border-color: #F0DC9C; }
/* 다음 경기 배정 카드: 지옥도·중립·천국도 — 같은 구조, 배경·색만 다름 */
.fate { position: relative; overflow: hidden; isolation: isolate; border-radius: var(--r-card); padding: 14px 16px 16px; min-height: 168px; display: grid; align-content: start; gap: 4px; color: var(--f-ink); background: var(--f-bg); border: 1px solid var(--f-line); }
.fate::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: var(--f-deco); }
.fate > :not(.fate-ch) { position: relative; z-index: 1; max-width: 64%; }
.fate-top { max-width: none !important; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 8px; align-items: center; margin-bottom: 4px; }
.fate-eyebrow { font-size: var(--fs-cap); font-weight: 700; color: var(--f-ink-2); }
.fate-basis { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: var(--r-badge); background: var(--f-chip); color: var(--f-ink); }
.fate-name { font-family: var(--font-brand); font-weight: 400; font-size: 34px; line-height: 1.05; letter-spacing: .01em; color: var(--f-accent); }
.fate-desc { font-size: var(--fs-sm); line-height: 1.5; color: var(--f-ink); }
.fate-quote { margin-top: 4px; font-size: var(--fs-sm); font-weight: 700; color: var(--f-ink); }
.fate-quote span { font-weight: 500; color: var(--f-ink-2); }
.fate-ch { position: absolute; right: 10px; bottom: 0; z-index: 1; --chh: 104px; }
.fate-ch.ch-cv { --chh: 120px; bottom: 6px; }
/* 지옥도: 버건디·짙은 빨강·주황, 은은한 불빛과 불씨 */
.fate-hell { --f-ink: #FFF3EC; --f-ink-2: #F6C9B4; --f-accent: #FFC928; --f-chip: rgb(255 255 255 / .14); --f-line: #4A0F14;
  --f-bg: linear-gradient(160deg, #3A0B10 0%, #6B151C 55%, #8E2418 100%);
  --f-deco: radial-gradient(70% 60% at 85% 115%, rgb(255 130 50 / .45), transparent 70%), radial-gradient(40% 40% at 100% 0%, rgb(255 90 60 / .18), transparent 70%),
    radial-gradient(2px 2px at 62% 30%, rgb(255 200 110 / .8), transparent), radial-gradient(1.6px 1.6px at 74% 18%, rgb(255 170 80 / .7), transparent),
    radial-gradient(1.4px 1.4px at 90% 44%, rgb(255 210 140 / .7), transparent), radial-gradient(1.8px 1.8px at 56% 70%, rgb(255 160 70 / .5), transparent); }
/* 중립: 회청·슬레이트·밝은 회색, 절제된 수평선 하나 */
.fate-mid { --f-ink: #26324A; --f-ink-2: #5A6782; --f-accent: #3B4A66; --f-chip: rgb(255 255 255 / .75); --f-line: #D3DBE6;
  --f-bg: linear-gradient(160deg, #F2F5F9 0%, #E3E9F1 60%, #D3DCE8 100%);
  --f-deco: linear-gradient(transparent calc(78% - 1px), rgb(59 74 102 / .14) calc(78% - 1px) calc(78% + 1px), transparent calc(78% + 1px)); }
/* 천국도: 하늘·청록·크림, 은은한 구름과 빛 */
.fate-heaven { --f-ink: #123F52; --f-ink-2: #3F6E80; --f-accent: #0E6E8C; --f-chip: rgb(255 255 255 / .75); --f-line: #CFE7EF;
  --f-bg: linear-gradient(175deg, #CDEFFA 0%, #E3F6F6 55%, #FFF8E8 100%);
  --f-deco: radial-gradient(60% 50% at 95% -10%, rgb(255 255 255 / .9), transparent 70%),
    radial-gradient(22% 16% at 72% 30%, rgb(255 255 255 / .75), transparent 70%), radial-gradient(16% 12% at 82% 24%, rgb(255 255 255 / .7), transparent 70%),
    radial-gradient(26% 14% at 60% 88%, rgb(255 255 255 / .6), transparent 70%); }
.hist { display: grid; }
.hist-week { display: grid; gap: 6px; padding-block: 10px; border-top: 1px solid var(--line-2); }
.hist-week > b { font-size: var(--fs-sm); font-weight: 700; color: var(--navy); }
.hist-line { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 14px; }
.hist-line .no { font-size: var(--fs-cap); color: var(--text-2); min-width: 36px; }
.r { font-size: 12px; font-weight: 700; border-radius: var(--r-badge); padding: 1px 8px; }
.r.w { background: var(--win); color: #fff; }
.r.l { background: var(--line-2); color: var(--text-2); }
.r.p { color: var(--text-2); border: 1px dashed var(--line); }

/* ---------- 관리 ---------- */
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.seg button { border: 0; background: none; border-radius: var(--r-ctl); padding: 6px 12px; font-size: 14px; font-weight: 500; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; font-weight: 700; }
input[type=text], input[type=password], input[type=number], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 7px 10px; min-height: 40px; color: var(--text); min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--heaven); outline: none; box-shadow: 0 0 0 3px rgb(52 120 212 / .15); }
textarea { width: 100%; min-height: 84px; resize: vertical; }
.pin { font-size: 22px; letter-spacing: .4em; text-align: center; width: 9ch; font-weight: 700; }
.pinf { justify-items: center; text-align: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: var(--r-ctl); padding: 5px 10px; font-size: 14px; }
.chips button[aria-pressed="true"] { background: var(--navy-50); border-color: var(--navy); color: var(--navy); font-weight: 700; }
.chips button[aria-pressed="true"]::before { content: "✓ "; }
.group-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.editor { display: grid; gap: 10px; padding-top: 4px; }
.ed-match { border: 1px solid var(--line); border-radius: var(--r-card); padding: 10px; display: grid; gap: 8px; background: var(--surface); }
.ed-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ed-head > b { font-size: var(--fs-sm); font-weight: 700; color: var(--navy); }
.ed-teams { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; }
.ed-team { display: grid; gap: 6px; min-width: 0; padding: 6px; border-radius: var(--r-ctl); background: var(--surface-2); }
.slot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px; }
.slot select { width: 100%; }
.slot button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; font-size: 11px; font-weight: 500; padding: 0 6px; color: var(--text-2); }
.slot button[aria-pressed="true"] { color: var(--hell-text); border-color: #F1CACA; background: var(--hell-50); font-weight: 700; }
.ed-vs { font-size: var(--fs-cap); font-weight: 700; color: var(--text-2); }
@media (max-width: 460px) {
  .ed-teams { grid-template-columns: 1fr; }
  .ed-vs { justify-self: center; }
}
.issues { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.issues li { font-size: 14px; padding: 7px 10px; border-radius: var(--r-ctl); }
.issues li.error { background: var(--danger-50); color: var(--hell-text); }
.issues li.warn { background: var(--yellow-50); }
.issues li.ok { background: var(--win-50); color: var(--win-text); font-weight: 700; }
.chips .mv { font-size: 12px; margin-left: 2px; }
.shift { display: grid; gap: 8px; border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); padding: 18px 0; margin: 8px 0; }
.shift p { margin: 0; }
.shift .shift-title { margin-bottom: 2px; }
.att-group { margin-top: 6px; }
.chips .mv.up { color: var(--hell-text); }
.chips .mv.down { color: var(--heaven-text); }
.ai-preview { display: grid; gap: 10px; border-top: 1px solid var(--line-2); padding-top: 12px; }
.ai-say { margin: 0; padding: 10px 12px; border-radius: var(--r-ctl); background: var(--navy-50); color: var(--navy); font-size: 14px; }
.ai-line { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 14px; padding: 6px 8px; border-radius: var(--r-ctl); background: var(--surface-2); }
.ai-line.changed { background: var(--yellow-50); }
.ai-line > .num { font-size: 12px; color: var(--text-2); }
.plist { display: grid; gap: 6px; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; }
.seedlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.seedlist li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line-2); border-radius: var(--r-ctl); padding: 6px 8px; background: var(--surface); }
.seedlist li b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seedlist .btn.sm { min-width: 36px; padding-inline: 8px; }
.copybox { font-size: 13px; min-height: 160px; }

/* ---------- 하단 저장 영역 ---------- */
.savebar { position: fixed; left: 0; right: 0; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); z-index: 10; background: var(--navy); color: #fff; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -4px 16px rgb(32 38 79 / .18); }
.savebar .in { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; font-weight: 500; }
.savebar .btn { min-height: 40px; background: transparent; color: #fff; border-color: rgb(255 255 255 / .4); }
.savebar .btn.primary { background: var(--yellow); border-color: var(--yellow); color: var(--navy); min-width: 88px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(132px + env(safe-area-inset-bottom, 0px)); z-index: 11; background: var(--navy); color: #fff; border-radius: var(--r-ctl); padding: 10px 14px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgb(32 38 79 / .25); }
@media (prefers-reduced-motion: no-preference) {
  .team, .btn, .chips button, .gsel button, .weeks button, .tabs button { transition: background-color .15s, border-color .15s, color .15s; }
}


/* ---------- 팀색 깔맞춤 (조 화면 안의 WIN도 팀색, 조 밖은 초록) ----------
   진한 색: 글자·선택 상태(흰 글자 대비 8:1 이상) / 중간 색: 얇은 선 / 연한 색: 배경 */
.gA { --t-deep: #6E1B26; --t-mid: #B8403A; --t-tint: #FBEEEF; --t-line: #EBC6C9; }
.gB { --t-deep: #1E5B3D; --t-mid: #2E8B57; --t-tint: #EAF4EE; --t-line: #BFDCCB; }
.gC { --t-deep: #8E2C4B; --t-mid: #D2648A; --t-tint: #FDEEF3; --t-line: #F0C6D5; }
.team-zone { display: grid; gap: var(--sp-4); }
/* 조 선택(순위·편성·실력 순위): 선택된 조는 팀 진한 색 */
.gsel button[aria-pressed="true"] { background: var(--t-deep, var(--navy)); border-color: var(--t-deep, var(--navy)); }
.gsel button[aria-pressed="true"]::before { background: rgb(255 255 255 / .75); }
/* 경기 카드: 번호 글자 + 왼쪽 얇은 선만 팀색 */
.group .match { border-left: 3px solid var(--t-mid); }
/* 슈퍼매치 경기: 조 색 테두리 2px + 아주 연한 조 색 배경(기존 조 토큰 --t-mid / --t-tint 재사용). 선수 칸은 흰색으로 두어 이름이 또렷하게 */
.group .match.super { border: 2px solid var(--t-mid); background: var(--t-tint); box-shadow: none; }
.group .match.super .team:not(.win) { background: var(--surface); border-color: var(--t-line); }
.group .m-no { color: var(--t-deep); }
/* 이긴 칸만 팀색(연한 바탕 + 옅은 테두리 + 진한 WIN), 카드 바탕은 흰색 유지 */
.group .team.win { background: var(--t-tint); border-color: var(--t-line); color: var(--t-deep); }
.group .win-badge { background: var(--t-deep); }
.group .m-state.done { color: var(--t-deep); }
.me-zone .r.w { background: var(--t-deep); }
.pl.me { color: var(--t-deep, var(--heaven-text)); text-decoration-color: var(--t-mid, currentColor); text-decoration-thickness: 2px; }
/* 순위: 다승왕권·동률 추첨은 이름 옆 왕관 아이콘만(글자 배지 없음, 2026-11-20) / 1위 메달 금색 유지 */
.crown { width: 18px; height: 18px; vertical-align: -3px; fill: #E9A800; stroke: #8A5A00; stroke-width: .8; stroke-linejoin: round; flex: none; }
p .crown { margin-right: 2px; }
.team-zone .rrow.contender { background: var(--t-tint); }
.team-zone .rnum.strong { color: var(--t-deep); }
.team-zone .rrow.me .rname b { color: var(--t-deep); text-decoration: underline; text-decoration-color: var(--t-mid); text-underline-offset: 3px; }
.chip.king::before { content: "♛"; margin-right: 3px; }
.team-zone .chip.king { background: var(--t-deep); border-color: var(--t-deep); color: #fff; }
/* 내 기록: 작은 팀 배너 + 숫자·강조를 팀색으로 */
.me-zone .team-banner { min-height: 104px; }
.me-zone .ch-cv { --chh: 96px; }
.me-zone .ch-lb, .me-zone .ch-bf, .me-zone .ch-lm, .me-zone .ch-pk, .me-zone .ch-ck { --chh: 74px; }
.me-zone .stat { border-top: 3px solid var(--t-mid); }
.me-zone .stat b { color: var(--t-deep); }
.me-zone .stat.hl { background: var(--t-tint); border-color: var(--t-tint); border-top-color: var(--t-mid); }
.me-zone .me-head h2 { color: var(--t-deep); }
.team-zone .chip.lot { background: var(--surface); border-color: var(--t-mid); color: var(--t-deep); }
.fate { min-height: 196px; }
.fate p { word-break: keep-all; overflow-wrap: anywhere; }
@media (min-width: 600px) { .fate { min-height: 172px; } }
@media (min-width: 600px) { .fate-ch { --chh: 136px; right: 24px; } .fate-ch.ch-cv { --chh: 150px; } }

/* ---------- 돼블스플랜 ----------
   이벤트 비주얼(배너·장 마감 리포트)만 --plan-bg로 강하게, 선택·목록은 기존 흰 카드·navy·yellow 그대로 */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* 순위표 보너스 칸 */
.rrow .bonus { font-weight: 700; }
.rrow .bonus.plus, .king .bonus.plus { color: var(--win-text); }
.rrow .bonus.minus, .king .bonus.minus { color: var(--hell-text); }
@media (max-width: 420px) {
  .rrow { grid-template-columns: 34px minmax(0, 1fr) 30px 40px 30px 44px; gap: 6px; padding-inline: 10px; }
  .rrow.rhead { font-size: 11px; }
}
/* 배너: 팀 배너와 같은 높이, 어두운 경기장 + 아래에서 올라오는 핑크 빛 + 후드 돼지 */
.plan-banner { position: relative; overflow: hidden; isolation: isolate; min-height: 132px; border-radius: var(--r-card); color: #fff;
  background: radial-gradient(80% 70% at 70% 125%, rgb(240 32 104 / .5), transparent 70%), radial-gradient(50% 60% at 0% 0%, rgb(240 32 104 / .12), transparent 70%), var(--plan-bg); }
.pb-text { position: relative; z-index: 2; display: grid; gap: 4px; align-content: start; padding: 14px 0 14px 16px; max-width: 64%; }
.pb-kicker { font-size: 12px; font-weight: 700; color: #FFD6E4; }
.pb-title { font-family: var(--font-brand); font-weight: 400; font-size: clamp(30px, 9vw, 40px); line-height: 1; letter-spacing: .01em; color: #fff; white-space: nowrap; }
.pb-title em { font-style: normal; color: var(--plan); }
.pb-sub { font-size: 13px; font-weight: 500; color: #F6E7EE; }
.pb-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.pb-cd { font-size: 18px; font-weight: 700; line-height: 1; padding: 7px 10px; border-radius: var(--r-badge); background: var(--plan); color: #fff; white-space: nowrap; } /* 흰 글씨는 18px 볼드 */
.pb-n { font-size: 13px; font-weight: 700; line-height: 1; padding: 9px 10px; border-radius: var(--r-badge); background: rgb(255 255 255 / .12); color: #fff; }
.pb-pig { position: absolute; right: -8px; bottom: 0; z-index: 1; height: 100%; aspect-ratio: 440 / 360; background: var(--img-plan-pig) right bottom / contain no-repeat;
  -webkit-mask: linear-gradient(90deg, transparent 0, #000 28%); mask: linear-gradient(90deg, transparent 0, #000 28%); }
@media (max-width: 420px) {
  /* 좁은 화면: 부제는 숨기고 참여 인원은 글자로, 돼지는 오른쪽으로 밀어 글자와 겹치지 않게 */
  .pb-text { max-width: 60%; padding-right: 0; }
  .pb-title { font-size: clamp(26px, 7.6vw, 32px); }
  .pb-sub { display: none; }
  .pb-chips { flex-direction: column; align-items: flex-start; gap: 4px; }
  .pb-n { padding: 0; background: none; font-size: 13px; color: #F6E7EE; }
  .pb-pig { right: -36px; }
}
@media (min-width: 600px) { .plan-banner { min-height: 148px; } .pb-text { padding: 18px 0 18px 22px; } .pb-pig { right: 8px; } }
/* 인기 픽·체결 */
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--plan); margin-right: 6px; vertical-align: 2px; box-shadow: 0 0 0 3px rgb(240 32 104 / .18); }
.pp .live-dot { background: var(--rose); box-shadow: none; }
/* 인기 픽 색 체계: 네이비(1팀·왼쪽) + 뮤트 로즈(2팀·오른쪽). 팀 색은 비율과 상관없이 고정, 인기 픽·역배 후보는 배지로만 표현
   그라데이션·그림자 없음, 수치는 막대 바깥. 이 카드 안에서만 적용 */
.pp { --navy: #252D59; --rose: #C65378; --rose-text: #A94365; --text: #24283A; --text-2: #737B90; --line: #DCE2EF; --line-2: #E9EDF5;
  background: #FFFFFF; border-color: var(--line); color: var(--text); box-shadow: none; }
.pp .muted { color: var(--text-2); }
.pp-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.pp-list { list-style: none; margin: 0; padding: 0; display: grid; }
.pp-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) 78px; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line-2); }
.pp-row:first-child { border-top: 0; }
.pp-rank { font-size: 17px; font-weight: 700; color: var(--navy); text-align: center; }
.pp-main { min-width: 0; display: grid; gap: 2px; }
.pp-name { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; }
.pp-name b { font-size: 15px; font-weight: 700; }
.pp-sub { font-size: var(--fs-cap); font-weight: 500; color: var(--text-2); }
.pe-bar { display: block; height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; margin-top: 4px; }
.pe-bar i { display: block; height: 100%; background: var(--navy); border-radius: 2px; }
/* 인기 픽 막대: 회색 바탕(테두리) 안에 핑크 채움 */
.pp-bar { display: block; height: 10px; margin-top: 6px; border-radius: 5px; background: var(--line-2); overflow: hidden; }
.pp-bar i { display: block; height: 100%; border-radius: 5px; background: var(--navy); }
/* 인기 픽 조 탭: 전체 + 조 3개 */
.pp-groups { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pp-groups button { font-size: 13px; padding: 6px 2px; }
.pp-groups button.gall::before { background: var(--navy); }
.pp-nums { display: grid; justify-items: end; gap: 2px; }
.pp-nums b { font-size: 16px; font-weight: 700; color: var(--navy); }
.pp-nums span { font-size: var(--fs-cap); font-weight: 700; color: var(--text-2); }
/* 인기 픽 배지: 인기 픽(빨강) · 역배 후보(파랑) · 슈퍼매치(노랑, 불꽃) — 뜻이 다르므로 색도 다르게 */
.chip.hot { background: #FBE8EF; color: #A94365; border-color: #F3CDDA; }
.chip.under { background: #EAF1FF; color: #315CA8; border-color: #CADAF7; }
.chip.super { background: #FFF2D5; color: #8B6418; border-color: #F0DCA6; }
.m-head .chip.super { margin-right: auto; }
/* 팀별 인기 픽: 경기 하나 = 카드 하나. 왼쪽 팀 navy, 오른쪽 팀 핑크로 고정 */
.mb-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.mb { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-card); background: #FFFFFF; }
.mb-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.mb-title { font-size: 14px; color: var(--navy); }
.mb-total { justify-self: center; font-size: 14px; font-weight: 700; color: var(--text); }
.mb-teams { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mb-team { display: grid; gap: 2px; justify-items: start; align-content: start; min-width: 0; }
.mb-team.b { justify-items: end; text-align: right; }
.mb-name { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
.mb-fig { display: flex; align-items: baseline; gap: 6px; }
.mb-team.b .mb-fig { flex-direction: row-reverse; }
.mb-fig b { font-size: 26px; font-weight: 900; line-height: 1.15; }
.mb-fig span { font-size: 15px; font-weight: 700; color: var(--text); }
.mb-team.a .mb-fig b { color: var(--navy); }
.mb-team.b .mb-fig b { color: var(--rose); }
.mb-bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line-2); }
.mb-bar i { display: block; height: 100%; }
.mb-bar i.a { background: var(--navy); }
.mb-bar i.b { background: var(--rose); }
.mb-bar i.a + i.b { box-shadow: -2px 0 0 #fff; }
.pp-nums .pp-pct { font-size: 14px; color: var(--text); }
.chip.sneaky { background: #FBE8EF; color: #A94365; border-color: #F3CDDA; }
.feed { gap: 6px; }
.feed-row { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 14px; min-height: 32px; }
.feed-t { color: var(--text-2); font-size: var(--fs-sm); }
.feed-team { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.buy { color: var(--navy); font-size: var(--fs-sm); }
.mchip { display: inline-flex; padding: 1px 7px; border-radius: var(--r-badge); font-size: 11px; font-weight: 700; white-space: nowrap; border: 1px solid; }
.mchip.high { background: #FCE8F0; color: var(--plan-text); border-color: #F5C3D7; }
.mchip.safe { background: var(--surface-2); color: var(--text-2); border-color: var(--line); }
@media (prefers-reduced-motion: no-preference) {
  .feed-row.new { animation: feed-in .5s ease-out; }
  @keyframes feed-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
}
/* 하단 고정 바 (내 예측 하기 / 제출) */
.plan-cta { position: fixed; left: 0; right: 0; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); z-index: 9; padding: 10px 16px; background: linear-gradient(180deg, rgb(244 247 252 / 0), var(--bg) 30%); }
.plan-cta .in { max-width: 688px; margin: 0 auto; display: grid; gap: 8px; }
.plan-cta .btn.primary { min-height: 52px; font-size: 17px; gap: 8px; box-shadow: 0 4px 14px rgb(32 38 79 / .15); }
.plan-cta .btn small { font-size: 13px; font-weight: 500; }
.pe-bar-fixed { background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgb(32 38 79 / .08); }
.pe-sum { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 14px; }
.up { color: var(--hell-text); font-weight: 700; }
.down { color: var(--heaven-text); font-weight: 700; }
/* 예측하기 */
.pe-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.pe-head .btn { min-width: 44px; min-height: 44px; font-size: 18px; }
.pe-cd { font-size: 13px; font-weight: 700; color: var(--plan-text); background: #FCE8F0; border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
.mode-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 380px) { .mode-cards { grid-template-columns: 1fr; } }
.mode-card { display: grid; gap: 6px; align-content: start; text-align: left; min-height: 44px; padding: 12px 14px; border: 2px solid var(--line-2); background: var(--surface); border-radius: var(--r-card); }
.mode-card[aria-checked="true"] { border-color: var(--navy); box-shadow: 0 0 0 1px var(--navy); }
.mc-tag { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--plan-text); }
.mc-name { font-size: 17px; font-weight: 700; color: var(--text); }
.mc-line { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; color: var(--text-2); }
.mc-line b { font-size: 14px; }
.pe-step { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.pe-dots { display: flex; gap: 4px; }
.pe-dots i { width: 22px; height: 5px; border-radius: 3px; background: var(--line); }
.pe-dots i.on { background: var(--navy); }
.pe-list { display: grid; gap: 8px; }
/* 예측하기: 이번 주 탭처럼 조별 배너 아래 조 색 카드 (조 토큰 --t-mid / --t-deep / --t-tint / --t-line 재사용) */
.pe-group { display: grid; gap: var(--sp-2); margin-top: var(--sp-2); }
.group .pe-match { border-left: 3px solid var(--t-mid); }
.group .pe-no { font-size: var(--fs-sm); font-weight: 700; color: var(--t-deep); }
.group .pe-match.super { border: 2px solid var(--t-mid); background: var(--t-tint); }
.group .pe-match.super .pe-team:not([aria-pressed="true"]) { background: var(--surface); border-color: var(--t-line); }
.pk .gdot { font-weight: inherit; gap: 5px; }
/* 제출 전 이름 확인 창 (아래에서 올라오는 시트) */
.pc-back { position: fixed; inset: 0; z-index: 14; background: rgb(20 24 40 / .45); }
.pc-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; max-width: 560px; margin: 0 auto; display: grid; gap: 10px;
  padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-radius: 16px 16px 0 0; box-shadow: 0 -6px 24px rgb(20 24 40 / .18); }
.pc-sheet h3 { font-size: 17px; }
.pc-name { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; padding: 12px 14px; border: 2px solid var(--navy); border-radius: var(--r-card); background: var(--navy-50); }
.pc-name b { font-size: 28px; font-weight: 900; line-height: 1.2; color: var(--navy); }
.pc-name .gdot { font-size: 14px; color: var(--text-2); order: 2; }
.pc-warn { font-size: 14px; font-weight: 700; color: var(--hell-text); }
.pc-mode { font-size: 14px; }
.pc-picks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.pc-picks li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; padding: 6px 10px; border-radius: var(--r-ctl); background: var(--surface-2); font-size: 14px; }
.pc-picks .gdot { font-weight: 500; color: var(--text-2); }
.pc-btns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 8px; margin-top: 4px; }
.pc-btns .btn { min-height: 48px; font-size: 15px; }
.pe-match { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 10px 12px 12px; display: grid; gap: 8px; box-shadow: var(--shadow); }
.pe-match.dim { opacity: .45; }
.pe-mhead { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.pe-mhead .chip.super { margin-right: auto; }
.pe-mhead .gdot { font-size: var(--fs-sm); color: var(--navy); }
.pe-teams { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pe-team { position: relative; display: grid; gap: 2px; text-align: left; min-height: 56px; padding: 8px 32px 8px 10px; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-ctl); }
.pe-team[aria-pressed="true"] { border: 2px solid var(--navy); padding: 7px 31px 7px 9px; background: var(--navy-50); }
.pe-team[disabled] { cursor: not-allowed; }
.pe-tn { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
.pe-tc { font-size: var(--fs-cap); color: var(--text-2); }
.pe-ck { position: absolute; right: 8px; top: 8px; width: 20px; height: 20px; border-radius: 50%; display: none; place-items: center; background: var(--navy); color: #fff; font-style: normal; font-size: 12px; font-weight: 700; }
.pe-team[aria-pressed="true"] .pe-ck { display: grid; }
/* 결과: 4칸 체크 행 */
.mp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.pick4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 600px) { .pick4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.pk { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 6px 8px; border-radius: var(--r-ctl); border: 1px solid var(--line-2); background: var(--surface-2); font-size: 13px; }
.pk > span:not(.sr) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pk i { flex: none; font-style: normal; font-weight: 700; width: 18px; text-align: center; color: var(--text-2); }
.pk.hit { background: var(--win-50); border-color: #BFE3CF; } .pk.hit i { color: var(--win-text); }
.pk.miss { background: var(--hell-50); border-color: #F1CACA; } .pk.miss i { color: var(--hell-text); }
.pk.check { background: var(--yellow-50); border-color: #F0DC9C; } .pk.check i { color: #7A5600; }
.pick4.sm .pk { padding: 3px 6px; font-size: 12px; }
.pred-res { font-size: 14px; font-weight: 700; color: var(--text-2); }
.pred-res.hit { color: var(--win-text); }
.pred-res.miss { color: var(--hell-text); }
.pred-res.check { color: #7A5600; }
.pub { display: grid; }
.pub-row { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line-2); }
.pub-row:first-child { border-top: 0; }
.pub-row.me .pub-who b:first-child { color: var(--heaven-text); }
.pub-who { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.pub-who .pred-res { margin-left: auto; font-size: 13px; }
.king { list-style: none; margin: 0; padding: 0; display: grid; }
.king li { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line-2); }
.king li:first-child { border-top: 0; }
.king li.me b { color: var(--heaven-text); }
.pa-edit { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface-2); }
.pa-edit select { width: 100%; }
/* 장 마감 리포트: 390px 화면 한 장에 들어가는 공유용 카드 */
.report { --rp-line: rgb(255 255 255 / .12); display: grid; gap: 10px; padding: 16px; border-radius: 20px; color: #fff; overflow: hidden;
  background: radial-gradient(90% 40% at 0% 0%, rgb(240 32 104 / .28), transparent 70%), radial-gradient(60% 30% at 100% 100%, rgb(240 32 104 / .14), transparent 70%), var(--plan-bg); }
.rp-head { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: center; }
.rp-pig { width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--plan); background: var(--img-plan-pig) 30% 30% / 170% no-repeat, #3A1422; }
.rp-date { font-size: 13px; font-weight: 700; color: #FFD6E4; }
.rp-title { font-family: var(--font-brand); font-weight: 400; font-size: 30px; line-height: 1.05; color: #fff; }
.rp-title em { font-style: normal; color: var(--plan); }
.rp-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--rp-line); border-radius: 14px; background: rgb(255 255 255 / .04); }
.rp-stats div { display: grid; justify-items: center; padding: 8px 4px; }
.rp-stats div + div { border-left: 1px solid var(--rp-line); }
.rp-stats b { font-size: 26px; font-weight: 900; line-height: 1.15; }
.rp-stats span { font-size: 13px; color: #F6E7EE; }
.rp-stats .hit b { color: var(--plan); }
.rp-stats .miss b { color: var(--heaven); }
.rp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.rp-cell { display: grid; gap: 2px; align-content: start; padding: 10px 12px; border: 1px solid var(--rp-line); border-radius: 14px; background: rgb(255 255 255 / .04); min-width: 0; }
.rp-ct { font-size: 13px; font-weight: 700; }
.rp-team { font-size: 15px; font-weight: 700; margin-top: 4px; overflow-wrap: anywhere; }
.rp-big { font-size: 30px; font-weight: 900; line-height: 1.1; }
.rp-cell.rp-up .rp-big { color: var(--plan); }
.rp-cell.rp-down .rp-big { color: var(--heaven); }
.rp-desc { font-size: 12px; line-height: 1.45; color: #F6E7EE; }
.rp-hitters { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--rp-line); border-radius: 14px; background: rgb(255 255 255 / .04); }
.rp-hitters b { font-size: 14px; }
.rp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.rp-chips span { font-size: 14px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--plan); background: rgb(240 32 104 / .16); }
.rp-chips em { font-style: normal; font-size: 13px; color: #F6E7EE; }
.rp-foot { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: #F6E7EE; }
.rp-overlay { position: fixed; inset: 0; z-index: 20; overflow: auto; display: grid; justify-items: center; align-content: start; gap: 10px; padding: 12px; background: #0B0407; }
.rp-overlay .report { width: 100%; max-width: 420px; }
.rp-overlay .btn { background: transparent; color: #fff; border-color: rgb(255 255 255 / .4); }

/* 이번 주 탭: 내 경기 | 전체 + 내 예측 실시간 (사용자 요청 2026-11-20) */
.seg.wview { display: flex; width: 100%; margin: 4px 0 10px; }
.seg.wview button { flex: 1; min-height: 40px; font-size: 15px; }
.my-pred.live { display: grid; gap: 8px; margin-bottom: 12px; }
.my-pred.live .mp-head { justify-content: flex-start; }
.my-pred.live .mp-head h3 { margin: 0; }
.mp-score { margin-left: auto; font-size: 15px; font-weight: 700; }
.my-pred.live.hit { border-color: #BFE3CF; background: var(--win-50); }
.my-pred.live.miss { border-color: #F1CACA; background: var(--hell-50); }
.my-pred.live .pred-res { font-size: 16px; }
.my-pred.mini { padding: 10px 12px; margin-bottom: 12px; }
.my-pred.mini p { margin: 0; }
button.link, a.link { border: 0; background: none; padding: 0; font: inherit; font-weight: 700; color: var(--navy); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.my-matches { margin-bottom: 14px; }
.my-matches h3 { margin: 0 0 8px; font-size: 16px; }
.my-matches .match-list { display: grid; gap: 10px; }
.m-grp { font-size: var(--fs-cap); color: var(--text-2); margin-bottom: -4px; }
.m-head { flex-wrap: wrap; row-gap: 6px; }
.m-no, .m-state { white-space: nowrap; }
.chip.mypick { background: #FCE8F0; color: var(--plan-text); border-color: #F5C3D7; }
.chip.mypick.hit { background: var(--win-50); color: var(--win-text); border-color: #BFE3CF; }
.chip.mypick.miss { background: var(--hell-50); color: var(--hell-text); border-color: #F1CACA; }
.m-head .chip.mypick { margin-left: auto; }
.m-head .chip.super + .chip.mypick { margin-left: 0; }
.team.picked { box-shadow: inset 0 0 0 2px #F5C3D7; }
.team.picked.win { box-shadow: inset 0 0 0 2px #8FCFAA; }
.team.picked.lose { box-shadow: inset 0 0 0 2px #E8A3A3; }

/* 내 예측 카드: 조 색 테두리로 어느 조 경기인지 (2026-11-20, 글자 라벨 대신). 결과는 배경색·아이콘 */
.pick4.grp .pk { border: 2px solid var(--gc, var(--line-2)); }
/* 조 얼굴 아이콘 (점 대신, 2026-11-20). 그림은 images.css --face-* (tools/make_faces.py) */
.face { width: 24px; height: 24px; flex: none; background: var(--fi) center / contain no-repeat; }
.pk i.face { width: 24px; }  /* .pk i(결과 아이콘 18px) 규칙보다 우선 */
.pick4.grp .pk { gap: 4px; padding: 6px; }
.pick4.grp .pk i:not(.face) { width: 14px; }  /* 360px에서 이름이 안 잘리게 */
.face-cv { --fi: var(--face-cv); } .face-lb { --fi: var(--face-lb); } .face-bf { --fi: var(--face-bf); }
.face-lm { --fi: var(--face-lm); } .face-pk { --fi: var(--face-pk); } .face-ck { --fi: var(--face-ck); }

/* ---------- 경기 진행: 코트 3칸 (2026-11-20) ---------- */
.courts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin: 4px 0 12px; }
@media (min-width: 600px) { .courts { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.court { border-radius: var(--r-card); padding: 10px 12px; display: grid; gap: 6px; background: var(--surface); border: 2px solid var(--gc, var(--line)); box-shadow: var(--shadow); }
.court.empty { border: 2px dashed var(--line); background: var(--surface-2); box-shadow: none; grid-template-columns: auto 1fr; align-items: center; color: var(--text-2); }
.court.empty b { color: var(--text); }
.court.empty span { justify-self: end; font-size: var(--fs-cap); }
.c-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.c-head b { font-size: 16px; }
.c-head .gdot { font-size: var(--fs-cap); color: var(--text-2); }
.c-head .num { margin-left: auto; font-size: var(--fs-cap); }
.c-team { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 44px; padding: 8px 12px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface-2); font-size: 15px; font-weight: 700; color: var(--text); text-align: left; cursor: pointer; }
.c-team small { flex: none; font-size: 12px; font-weight: 700; color: var(--win-text); border: 1px solid #BFE3CF; background: var(--win-50); border-radius: 999px; padding: 2px 8px; }
.c-team:active { background: var(--win-50); }
.court .vs { justify-self: center; font-size: 12px; color: var(--text-2); }
.court .link { justify-self: end; }
.away-box { display: grid; gap: 8px; margin-bottom: 12px; }
.ab-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ab-head h3 { margin: 0; font-size: 15px; }
.ab-list { display: flex; flex-wrap: wrap; gap: 6px; }
.ab-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 4px 4px 10px; border-radius: 999px; font-size: 13px; background: var(--yellow-50); border: 1px solid #F0DC9C; }
.ab-chip.out { background: var(--hell-50); border-color: #F1CACA; }
.ab-chip small { font-size: 11px; color: var(--text-2); }
.ab-chip button { border: 0; background: rgb(0 0 0 / .06); border-radius: 50%; width: 24px; height: 24px; font-size: 14px; line-height: 1; cursor: pointer; }
.ab-pick { display: grid; gap: 8px; padding: 10px; border-radius: var(--r-ctl); background: var(--surface-2); }
.ab-pick p { margin: 0; }
.ab-att button .gdot { font-weight: 500; }
.lv-sec { margin: 0 0 12px; display: grid; gap: 6px; }
.lv-sec h3 { margin: 0 0 2px; font-size: 15px; display: flex; align-items: baseline; gap: 6px; }
.lv-sec h3 small { margin-left: auto; font-size: var(--fs-cap); font-weight: 500; }
.lv-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--gc, var(--line)); }
.lv-row .btn { flex: none; }
.lv-main { display: grid; gap: 2px; min-width: 0; flex: 1; }
.lv-main .gdot.small { font-size: var(--fs-cap); color: var(--text-2); }
.lv-teams { font-size: 14px; font-weight: 700; word-break: keep-all; }
.lv-teams i { font-style: normal; font-weight: 500; color: var(--text-2); margin: 0 2px; }
.lv-row.blocked { opacity: .62; background: var(--surface-2); }
.lv-row.blocked small { color: var(--hell-text); font-size: 12px; }
.lv-row.done { padding: 8px 12px; }
.lv-row.done .lv-teams { font-weight: 500; }
.lv-done summary { list-style: none; cursor: pointer; }
.lv-done summary::-webkit-details-marker { display: none; }
.lv-done summary h3::after { content: "▾"; margin-left: auto; color: var(--text-2); }
.lv-done[open] summary h3::after { content: "▴"; }
.m-state.on { color: var(--plan-text); font-weight: 700; }
/* 회원: 지금 코트 + 내 차례 */
.courts.mini { gap: 6px; }
.courts.mini .court { padding: 8px 10px; gap: 2px; grid-template-columns: auto 1fr; align-items: center; column-gap: 8px; }
.courts.mini .court.on .gdot { justify-self: end; font-size: 11px; color: var(--text-2); }
.courts.mini .c-names { grid-column: 1 / -1; font-size: 13px; font-weight: 700; }
.courts.mini .c-names i { font-style: normal; font-weight: 500; color: var(--text-2); margin: 0 4px; }
.my-live { display: grid; gap: 6px; margin-bottom: 12px; border-left: 4px solid var(--navy); }
.my-live.away { border-left-color: var(--hell-text); background: var(--yellow-50); }
.my-live p { margin: 0; }

/* ---------- 경기·예측 화면: 조 점 → 얼굴, 이름만·크게·가운데 (사용자 요청 2026-11-22) ---------- */
.gdot.gA::before, .gdot.gB::before, .gdot.gC::before { width: 18px; height: 18px; border-radius: 0; background: center / contain no-repeat; }
.gdot.gA::before { background-image: var(--face-lb); }
.gdot.gB::before { background-image: var(--face-bf); }
.gdot.gC::before { background-image: var(--face-pk); }
/* 코트 */
.c-head .face { width: 26px; height: 26px; }
.c-team { justify-content: center; position: relative; font-size: 18px; padding: 10px 56px; text-align: center; }
.c-team span { word-break: keep-all; }
.c-team small { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); }
/* 바로 가능·못 함·완료: 얼굴은 왼쪽 위, 이름은 가운데 크게, 버튼은 아래 넓게 */
.lv-row { flex-direction: column; align-items: stretch; gap: 8px; position: relative; padding: 12px 14px; }
.lv-main { justify-items: center; text-align: center; gap: 4px; }
.lv-main .face { position: absolute; left: 12px; top: 10px; width: 26px; height: 26px; }
